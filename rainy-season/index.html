<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Glass Rainy Season Kit | Wasp Ecosystem</title>
<meta name="description" content="A pixel storm music player UI: frosted glass, silent lightning, a cheeky cat, a snail progress bar and puddle buttons.">
<meta name="theme-color" content="#0b1422">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=VT323&display=swap" rel="stylesheet">
<style>
:root{--ink:#e6f1ff;--dim:#8fa8c4;--storm:#0b1422;--storm2:#16263d;--blue:#2e4a6b;--mud:#6b5a45;--mud2:#8a7458;--slime:#9ff5c8;--head:"Silkscreen","Courier New",monospace;--body:"VT323","Courier New",monospace}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:linear-gradient(180deg,#0b1422,#1a2f4a 70%,#26344a);color:var(--ink);font:22px/1.2 var(--body);overflow:hidden;display:grid;place-items:center;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);image-rendering:pixelated}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#flash{position:fixed;inset:0;background:#cfe6ff;opacity:0;pointer-events:none;z-index:6}
#flash.go{animation:fl .7s steps(7)}
@keyframes fl{0%{opacity:0}8%{opacity:.75}16%{opacity:.1}28%{opacity:.55}100%{opacity:0}}
#bolt{position:fixed;top:0;width:60px;height:46vh;fill:#fff;opacity:0;pointer-events:none;z-index:6}
#bolt.go{animation:fl .7s steps(7)}
.card{position:relative;z-index:3;width:min(92vw,400px);padding:20px 18px 22px;background:rgba(170,205,240,.12);backdrop-filter:blur(7px) saturate(1.2);-webkit-backdrop-filter:blur(7px) saturate(1.2);border:3px solid rgba(200,225,255,.35);box-shadow:inset 0 0 0 3px rgba(255,255,255,.06),0 18px 40px rgba(0,0,0,.45)}
#drips{position:absolute;inset:0;width:100%;height:100%;z-index:4}
.kick{font:11px var(--head);letter-spacing:.2em;color:var(--dim);text-transform:uppercase}
h1{font:700 18px/1.2 var(--head);margin:6px 0 2px;text-transform:uppercase}
.art{color:var(--dim)}
.win{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.chip{font:10px var(--head);padding:6px 9px;background:rgba(10,20,36,.55);color:var(--ink);border:2px solid rgba(200,225,255,.35);cursor:pointer;text-transform:uppercase}
.bar{position:relative;height:34px;margin:26px 0 4px;touch-action:none;cursor:pointer}
.rail{position:absolute;left:0;right:0;bottom:6px;height:8px;background:rgba(10,20,36,.6);border:2px solid rgba(200,225,255,.25)}
.trail{position:absolute;left:0;bottom:6px;height:8px;width:0;background:var(--slime);box-shadow:0 0 10px 1px var(--slime)}
.snail{position:absolute;bottom:12px;width:36px;height:24px;margin-left:-6px;transition:none}
.times{display:flex;justify-content:space-between;color:var(--dim)}
.ctl{display:flex;justify-content:center;gap:14px;margin-top:16px}
.pud{position:relative;overflow:hidden;width:78px;height:54px;border:0;cursor:pointer;display:grid;place-items:center;color:#d9ecff;background:radial-gradient(ellipse at 35% 30%,#3d5f86 0,#24405f 45%,var(--mud) 100%);border-radius:58% 42% 52% 48%/52% 58% 42% 48%;box-shadow:inset 0 -6px 0 rgba(0,0,0,.25),0 6px 0 #3a2f22}
.pud.big{width:98px;height:62px;border-radius:44% 56% 48% 52%/58% 46% 54% 42%}
.pud:active{transform:translateY(3px);box-shadow:inset 0 -6px 0 rgba(0,0,0,.25),0 3px 0 #3a2f22}
.pud svg{width:24px;height:24px;fill:currentColor}
.rip{position:absolute;left:50%;top:50%;width:10px;height:10px;border:3px solid #cfe6ff;border-radius:50%;transform:translate(-50%,-50%);animation:rp .6s steps(6) forwards;pointer-events:none}
@keyframes rp{to{width:120px;height:120px;opacity:0}}
.ov{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:rgba(6,12,22,.82);text-align:center;padding:20px}
.ov[hidden],.pop[hidden]{display:none}
.btn{font:13px var(--head);padding:13px 22px;margin-top:14px;background:var(--slime);color:#08201a;border:0;cursor:pointer;text-transform:uppercase;box-shadow:inset -3px -3px 0 rgba(0,0,0,.25),inset 3px 3px 0 rgba(255,255,255,.35)}
.btn.alt{background:#c9d9ee;color:#0b1422}
.pop{position:fixed;z-index:9;left:50%;top:50%;width:min(88vw,340px);transform:translate(-50%,-50%);background:#c0c4cc;color:#101010;border:3px solid;border-color:#fff #4a4f5a #4a4f5a #fff;box-shadow:8px 8px 0 rgba(0,0,0,.55);animation:pp .35s steps(5)}
@keyframes pp{from{transform:translate(-50%,-40%) scale(.6);opacity:0}}
.pop .tb{background:linear-gradient(90deg,#10306a,#2a6fb0);color:#fff;font:12px var(--head);padding:6px 9px}
.pop .bd{padding:16px;text-align:center;display:grid;gap:10px;justify-items:center}
.pop svg{width:64px;height:64px;animation:bob 1.4s steps(4) infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.pop p{font:700 22px/1.15 var(--body)}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<canvas id="rain"></canvas>
<div id="flash"></div>
<svg id="bolt" viewBox="0 0 12 32" shape-rendering="crispEdges"><path d="M7 0h4v2H9v3H8v3H7v2H6v3h4v2H9v3H8v3H7v3H6v3H5v3H4v-3h1v-3h1v-3h1v-3h1v-3H4v-2h1v-3h1v-3h1z"/></svg>

<main class="card" id="card">
  <canvas id="drips"></canvas>
  <div class="win"><span class="kick">Glass Rainy Season</span><button class="chip" id="winBtn">Window: open</button></div>
  <h1 id="tt">Window Seat</h1>
  <p class="art" id="ar">Rainy Season</p>
  <div class="bar" id="bar">
    <div class="rail"></div><div class="trail" id="trail"></div>
    <svg class="snail" id="snail" viewBox="0 0 12 8" shape-rendering="crispEdges">
      <path fill="#b9a487" d="M0 6h9v2H0zM9 4h2v4H9z"/><path fill="#b9a487" d="M9 2h1v2H9zM11 3h1v1h-1z"/>
      <path fill="#7b8da8" d="M3 1h3v1H3zM2 2h5v1H2zM2 3h5v1H2zM2 4h5v1H2zM3 5h3v1H3z"/><path fill="#2b3b57" d="M4 3h1v1H4zM3 2h1v1H3zM5 4h1v1H5z"/>
      <path fill="#fff" d="M10 2h1v1h-1z" opacity=".0"/>
    </svg>
  </div>
  <div class="times"><span id="cur">0:00</span><span id="tot">0:00</span></div>
  <div class="ctl">
    <button class="pud" id="prev" aria-label="Previous"><svg viewBox="0 0 8 8" shape-rendering="crispEdges" style="transform:scaleX(-1)"><path d="M0 0h2v8H0zM2 1h2v6H2zM4 2h2v4H4zM6 3h2v2H6z"/></svg></button>
    <button class="pud big" id="play" aria-label="Play"><svg viewBox="0 0 8 8" shape-rendering="crispEdges" id="pi"><path d="M1 0h2v8H1zM3 1h2v6H3zM5 2h2v4H5z"/></svg></button>
    <button class="pud" id="next" aria-label="Next"><svg viewBox="0 0 8 8" shape-rendering="crispEdges"><path d="M0 0h2v8H0zM2 1h2v6H2zM4 2h2v4H4zM6 3h2v2H6z"/></svg></button>
  </div>
</main>

<div class="pop" id="pop" hidden>
  <div class="tb">MEOW_ALERT.EXE</div>
  <div class="bd">
    <svg viewBox="0 0 16 16" shape-rendering="crispEdges"><rect x="3" y="2" width="2" height="2" fill="#4a5568"/><rect x="11" y="2" width="2" height="2" fill="#4a5568"/><rect x="3" y="4" width="10" height="7" fill="#e8d9c0"/><rect x="5" y="7" width="1" height="1" fill="#101010"/><rect x="10" y="7" width="1" height="1" fill="#101010"/><rect x="7" y="8" width="2" height="1" fill="#c05a5a"/><rect x="4" y="11" width="8" height="3" fill="#e8d9c0"/><rect x="4" y="14" width="2" height="1" fill="#4a5568"/><rect x="10" y="14" width="2" height="1" fill="#4a5568"/><rect x="12" y="12" width="2" height="1" fill="#4a5568"/><rect x="13" y="11" width="1" height="1" fill="#4a5568"/></svg>
    <p id="popTxt">It’s raining cats and dogs. Close your windows!</p>
    <div class="row" id="popBtns"><button class="btn" id="yes">Yes, close</button><button class="btn alt" id="no">No, I like it wet</button></div>
  </div>
</div>

<div class="ov" id="start"><div><p class="kick">Glass Rainy Season Kit</p><h1 style="font-size:22px;margin:10px 0">A storm is coming</h1><p class="art">Use headphones for the full effect.</p><button class="btn" id="go">Tap to start</button></div></div>

<script>
const $=s=>document.querySelector(s);
const TR=[{t:"Window Seat",a:"Rainy Season",d:48,c:[174.6,220,261.6,329.6],s:[329.6,392,440,523.3]},
          {t:"Puddle Light",a:"Rainy Season",d:41,c:[146.8,220,261.6,349.2],s:[293.7,349.2,440,523.3]},
          {t:"Gumboot Waltz",a:"Rainy Season",d:55,c:[196,233.1,293.7,349.2],s:[293.7,349.2,392,466.2]}];
let ti=0,pos=0,playing=false,closed=false,ctx=null,pad,padG,rainF,rainG,popShown=false;
const fmt=s=>Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0");

/* ---------- audio: generated rain + soft pad + plucks (no files needed) ---------- */
function audio(){
  if(ctx)return; const AC=window.AudioContext||window.webkitAudioContext; if(!AC)return; ctx=new AC();
  const len=ctx.sampleRate*2,b=ctx.createBuffer(1,len,ctx.sampleRate),d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
  const n=ctx.createBufferSource();n.buffer=b;n.loop=true;
  rainF=ctx.createBiquadFilter();rainF.type="lowpass";rainF.frequency.value=5200;rainG=ctx.createGain();rainG.gain.value=.14;
  n.connect(rainF);rainF.connect(rainG);rainG.connect(ctx.destination);n.start();
  padG=ctx.createGain();padG.gain.value=0;const lp=ctx.createBiquadFilter();lp.type="lowpass";lp.frequency.value=700;
  padG.connect(lp);lp.connect(ctx.destination);
  pad=[0,1,2,3].map(i=>{const o=ctx.createOscillator();o.type=i%2?"triangle":"sine";o.connect(padG);o.start();return o});
  setInterval(pluck,1500);setTrackSound();
}
function setTrackSound(){if(!ctx)return;pad.forEach((o,i)=>o.frequency.setTargetAtTime(TR[ti].c[i],ctx.currentTime,.4))}
function mix(){if(!ctx)return;const t=ctx.currentTime;
  rainF.frequency.setTargetAtTime(closed?520:5200,t,.35);rainG.gain.setTargetAtTime(closed?.06:.14,t,.35);
  padG.gain.setTargetAtTime(playing?.05:0,t,.3)}
function pluck(){if(!ctx||!playing)return;const f=TR[ti].s[Math.floor(Math.random()*4)],o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime;
  o.type="sine";o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.07,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+1.2);
  o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+1.3)}

/* ---------- player ---------- */
function load(i){ti=(i+TR.length)%TR.length;pos=0;$("#tt").textContent=TR[ti].t;$("#ar").textContent=TR[ti].a;$("#tot").textContent=fmt(TR[ti].d);setTrackSound();draw()}
function draw(){const f=Math.min(pos/TR[ti].d,1),w=$("#bar").clientWidth-24;$("#trail").style.width=(f*w+12)+"px";$("#snail").style.left=(f*w)+"px";$("#cur").textContent=fmt(pos)}
function setPlay(p){playing=p;$("#pi").innerHTML=p?'<path d="M1 0h2v8H1zM5 0h2v8H5z"/>':'<path d="M1 0h2v8H1zM3 1h2v6H3zM5 2h2v4H5z"/>';mix()}
function rip(btn){const r=document.createElement("span");r.className="rip";btn.appendChild(r);setTimeout(()=>r.remove(),650)}
$("#play").onclick=e=>{rip(e.currentTarget);audio();if(ctx&&ctx.state==="suspended")ctx.resume();setPlay(!playing)};
$("#next").onclick=e=>{rip(e.currentTarget);load(ti+1)};
$("#prev").onclick=e=>{rip(e.currentTarget);pos>3?(pos=0,draw()):load(ti-1)};
setInterval(()=>{if(!playing)return;pos+=.1;if(pos>=TR[ti].d)load(ti+1);else draw()},100);
let drag=false;const seek=e=>{const r=$("#bar").getBoundingClientRect();pos=Math.min(Math.max((e.clientX-r.left-12)/(r.width-24),0),1)*TR[ti].d;draw()};
$("#bar").addEventListener("pointerdown",e=>{drag=true;seek(e)});addEventListener("pointermove",e=>{if(drag)seek(e)});addEventListener("pointerup",()=>drag=false);

/* ---------- storm ---------- */
const cv=$("#rain"),cx=cv.getContext("2d"),dv=$("#drips"),dx=dv.getContext("2d");let W,H,drops=[],drips=[],DW,DH;
function size(){W=cv.width=innerWidth;H=cv.height=innerHeight;const c=$("#card");DW=dv.width=c.clientWidth;DH=dv.height=c.clientHeight;draw()}
addEventListener("resize",size);
function frame(){cx.clearRect(0,0,W,H);const want=closed?55:150;while(drops.length<want)drops.push({x:Math.random()*W,y:Math.random()*H,v:10+Math.random()*9,l:8+Math.random()*14});drops.length=Math.min(drops.length,want);
  cx.fillStyle="rgba(175,205,235,.55)";for(const p of drops){cx.fillRect(Math.round(p.x/3)*3,Math.round(p.y/3)*3,3,p.l);p.y+=p.v;p.x-=1.2;if(p.y>H){p.y=-20;p.x=Math.random()*W}}
  dx.clearRect(0,0,DW,DH);
  if(closed){if(drips.length<14&&Math.random()<.08)drips.push({x:Math.floor(Math.random()*(DW/3))*3,y:0,v:.4+Math.random()*1.1,len:0,h:6+Math.random()*30});
    for(let i=drips.length-1;i>=0;i--){const d=drips[i];if(Math.random()<.04)d.v=.2+Math.random()*1.4;d.y+=d.v;
      dx.fillStyle="rgba(190,225,255,.22)";dx.fillRect(d.x,Math.max(0,d.y-d.h),3,Math.min(d.h,d.y));dx.fillStyle="rgba(235,247,255,.85)";dx.fillRect(d.x-1,d.y,5,5);
      if(d.y>DH)drips.splice(i,1)}}
  requestAnimationFrame(frame)}
function lightning(){const f=$("#flash"),b=$("#bolt");b.style.left=(8+Math.random()*80)+"vw";
  for(const e of [f,b]){e.classList.remove("go");void e.offsetWidth;e.classList.add("go")}
  setTimeout(lightning,4000+Math.random()*5000)}                    // silent on purpose

/* ---------- cat pop-up + window ---------- */
function setWindow(c){closed=c;$("#winBtn").textContent="Window: "+(c?"shut":"open");mix()}
$("#winBtn").onclick=()=>setWindow(!closed);
function pop(txt,btns){$("#popTxt").textContent=txt;$("#popBtns").style.display=btns?"flex":"none";$("#pop").hidden=false}
$("#yes").onclick=()=>{setWindow(true);pop("Good human. Now the glass can cry instead of you.",false);setTimeout(()=>$("#pop").hidden=true,2600)};
$("#no").onclick=()=>{pop("Suit yourself. Meow.",false);setTimeout(()=>$("#pop").hidden=true,2000)};
$("#go").onclick=()=>{$("#start").hidden=true;audio();if(ctx&&ctx.state==="suspended")ctx.resume();mix();lightning();
  setTimeout(()=>{if(!popShown){popShown=true;pop("It’s raining cats and dogs. Close your windows!",true)}},6500)};
size();load(0);frame();
</script>
</body>
</html>
