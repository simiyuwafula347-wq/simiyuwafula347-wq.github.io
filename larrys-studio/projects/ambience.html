<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ambience — Larry Simiyu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Caveat:wght@600;700&family=Press+Start+2P&family=VT323&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
</head>
<body>
<div class="wrap">
  <nav class="topbar">
    <a class="btn alt" href="../index.html#projects">← Back to projects</a>
    <div class="themes-mini" role="group" aria-label="Choose a theme">
      <button class="icon-btn" data-set-theme="paper" type="button">Paper</button>
      <button class="icon-btn" data-set-theme="pixel" type="button">Pixel</button>
      <button class="icon-btn" data-set-theme="muscovy" type="button">Muscovy</button>
    </div>
  </nav>

  <header class="cozy-hero">
    <div class="hello"><span data-hello>Hello</span> ✦</div>
    <h1>Ambience</h1>
    <p>Soundscapes &amp; moods, made to sit quietly beside your work.</p>
  </header>

  <!-- continue listening -->
  <div class="box cont" data-title="NOW_PLAYING.EXE">
    <div class="cover">🌧️</div>
    <div>
      <small>Continue listening</small>
      <h3>Rain &amp; Thunder</h3>
      <span class="pill">Rain</span>
      <div class="bar"><i></i></div>
      <small>68% · 7 min left</small>
    </div>
    <button class="play" id="play" type="button" aria-label="Play">▶</button>
  </div>

  <section>
    <div class="car-head"><h2>Recommended for you</h2>
      <div class="nav"><button id="prev" type="button" aria-label="Previous">‹</button><button id="next" type="button" aria-label="Next">›</button></div>
    </div>
    <div class="chips" id="moods" role="group" aria-label="Explore by mood"></div>
    <div class="car" id="car"></div>
  </section>

  <div class="box wob greet" id="greet" data-title="HELLO.EXE"></div>
  <footer>© <span id="yr"></span> Larry Simiyu · Made with patience in Kenya</footer>
</div>
<script src="../studio.js"></script>
<script>
/* >>> demo tracks: replace with your real ambience later <<< */
const TRACKS = [
  {t:"Rain & Thunder", mood:"Rain",   len:"45 min", icon:"🌧️", isNew:true},
  {t:"Savannah Dusk",  mood:"Nature", len:"30 min", icon:"🌅"},
  {t:"Midnight Fire",  mood:"Night",  len:"60 min", icon:"🔥"},
  {t:"Deep Focus",     mood:"Focus",  len:"50 min", icon:"🎧"},
  {t:"River Morning",  mood:"Nature", len:"40 min", icon:"🏞️"},
  {t:"Quiet Library",  mood:"Focus",  len:"55 min", icon:"📚"}
];
const MOODS = ["All", ...new Set(TRACKS.map(x => x.mood))];
const car = document.getElementById("car"), moods = document.getElementById("moods");
function draw(m){
  car.innerHTML = TRACKS.filter(x => m === "All" || x.mood === m).map(x => `
    <article class="item"><div class="thumb">${x.icon}</div>
      <div class="txt">${x.isNew ? '<span class="tag">New</span>' : '<span class="tag">&nbsp;</span>'}<h3>${x.t}</h3>
      <p>${x.mood} · ${x.len}</p><div class="row"><a class="btn" href="#">Listen</a></div></div></article>`).join("");
  moods.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c.textContent === m));
}
MOODS.forEach(m => { const c = document.createElement("button"); c.className = "chip"; c.type = "button"; c.textContent = m; c.onclick = () => draw(m); moods.appendChild(c); });
draw("All");
document.getElementById("prev").onclick = () => car.scrollBy({left:-320, behavior:"smooth"});
document.getElementById("next").onclick = () => car.scrollBy({left: 320, behavior:"smooth"});
const pb = document.getElementById("play");
pb.onclick = () => pb.textContent = pb.textContent === "▶" ? "❚❚" : "▶";
document.getElementById("yr").textContent = new Date().getFullYear();
</script>
</body>
</html>
