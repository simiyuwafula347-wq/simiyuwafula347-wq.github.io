<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Red Thread</title>
<style>
:root{--paper:#efe6d2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--paper)}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
</style>
</head>
<body><a href="../../index.html" style="position:fixed;left:10px;top:10px;z-index:9999;font:12px/1 monospace;letter-spacing:.08em;text-transform:uppercase;color:#fff;background:rgba(20,20,30,.72);border:1px solid rgba(255,255,255,.4);padding:7px 10px;text-decoration:none;border-radius:4px">&lsaquo; studio</a>
<canvas id="c"></canvas>
<script>
const cv=document.getElementById('c'),x=cv.getContext('2d'),TAU=6.2832;
const hs=(a,b)=>{const v=Math.sin(a*127.1+b*311.7)*43758.5453;return v-Math.floor(v)}; // cheap repeatable noise
let w,h,dpr,s,seed=0;
function size(){dpr=Math.min(2,devicePixelRatio||1);w=innerWidth;h=innerHeight;cv.width=w*dpr;cv.height=h*dpr;s=Math.min(w,h)/300}

// paper: a seamless 256px tile of blotches, grain and fibres, drawn once
const tile=document.createElement('canvas');tile.width=tile.height=256;
(function(){const c=tile.getContext('2d');c.fillStyle='#efe6d2';c.fillRect(0,0,256,256);
  for(let i=0;i<16;i++){const X=Math.random()*256,Y=Math.random()*256,R=40+Math.random()*70,warm=Math.random()<.5;
    for(const dx of[-256,0,256])for(const dy of[-256,0,256]){c.setTransform(1,0,0,1,dx,dy);const g=c.createRadialGradient(X,Y,0,X,Y,R);
      g.addColorStop(0,warm?'rgba(170,130,70,.07)':'rgba(255,250,235,.12)');g.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=g;c.fillRect(X-R,Y-R,R*2,R*2)}}
  c.setTransform(1,0,0,1,0,0);const id=c.getImageData(0,0,256,256),d=id.data;
  for(let i=0;i<d.length;i+=4){const n=(Math.random()-.5)*22;d[i]+=n;d[i+1]+=n;d[i+2]+=n*1.1}c.putImageData(id,0,0);
  c.strokeStyle='rgba(120,95,60,.07)';c.lineWidth=.7;
  for(let i=0;i<120;i++){const X=Math.random()*256,Y=Math.random()*256,a=Math.random()*TAU,l=4+Math.random()*10;c.beginPath();c.moveTo(X,Y);c.lineTo(X+Math.cos(a)*l,Y+Math.sin(a)*l);c.stroke()}})();
const pat=x.createPattern(tile,'repeat');

// a wobbly closed loop, like a circle drawn by hand
function blob(cx,cy,R,so,amp){const n=26,p=[];x.beginPath();
  for(let i=0;i<n;i++){const a=i/n*TAU,r=R+(hs(i,seed+so)-.5)*amp;p.push([cx+Math.cos(a)*r,cy+Math.sin(a)*r])}
  x.moveTo((p[0][0]+p[n-1][0])/2,(p[0][1]+p[n-1][1])/2);
  for(let i=0;i<n;i++){const a=p[i],b=p[(i+1)%n];x.quadraticCurveTo(a[0],a[1],(a[0]+b[0])/2,(a[1]+b[1])/2)}x.closePath()}

let wx=0,wy=0,th=.2,dist=0,T=0,last=0,down=false,ptr={x:0,y:0};const cam={x:0,y:0},pts=[[0,0]];
function frame(ms){const dt=Math.min(.05,(ms-last)/1000);last=ms;T+=dt;seed=Math.floor(T*7); // lines re-wobble 7 times a second
  // the ball wanders lazily, or follows a finger
  let turn=.7*Math.sin(T*.37)+.5*Math.sin(T*.93+2)+.3*Math.sin(T*1.7);
  const ox=w/2-cam.x,oy=h/2-cam.y;
  if(down){let d=Math.atan2(ptr.y-(wy+oy),ptr.x-(wx+ox))-th;d=Math.atan2(Math.sin(d),Math.cos(d));turn=Math.max(-2.4,Math.min(2.4,d*3))}
  th+=turn*dt;const sp=(46+14*Math.sin(T*.6))*s;wx+=Math.cos(th)*sp*dt;wy+=Math.sin(th)*sp*dt;dist+=sp*dt;if(window.rtSound)rtSound(turn,sp/s,dt);
  const lp=pts[pts.length-1];if(Math.hypot(wx-lp[0],wy-lp[1])>=4*s){pts.push([wx,wy]);if(pts.length>2400)pts.shift()}
  cam.x+=(wx-cam.x)*Math.min(1,dt*2.2);cam.y+=(wy-cam.y)*Math.min(1,dt*2.2);
  const OX=w/2-cam.x,OY=h/2-cam.y,R=24*s*(1-.42*(1-Math.exp(-dist/(900*s)))),bx=wx+OX,by=wy+OY; // the ball shrinks as thread leaves it

  x.setTransform(dpr,0,0,dpr,0,0);x.fillStyle='#efe6d2';x.fillRect(0,0,w,h);
  x.save();x.translate(((OX%256)+256)%256-256,((OY%256)+256)%256-256);x.fillStyle=pat;x.fillRect(0,0,w+256,h+256);x.restore(); // paper moves with the world
  const vg=x.createRadialGradient(w/2,h/2,Math.min(w,h)*.3,w/2,h/2,Math.max(w,h)*.75);vg.addColorStop(0,'rgba(90,60,30,0)');vg.addColorStop(1,'rgba(90,60,30,.3)');x.fillStyle=vg;x.fillRect(0,0,w,h);

  // thread trail: three jittery strokes, dark under-ply, red body, pale highlight
  x.lineCap=x.lineJoin='round';
  [[3.4,'rgba(110,10,25,.55)'],[2.3,'#cf1f2f'],[.9,'rgba(255,125,125,.55)']].forEach(([lw,col],k)=>{
    x.strokeStyle=col;x.lineWidth=lw*Math.max(.8,s*.9);x.beginPath();
    pts.forEach((p,i)=>{const X=p[0]+OX+(hs(i,seed+k*13)-.5)*2.4*s+k*.6*Math.sin(i*.15),Y=p[1]+OY+(hs(i,seed+k*13+7)-.5)*2.4*s+k*.6*Math.cos(i*.15);i?x.lineTo(X,Y):x.moveTo(X,Y)});
    x.lineTo(bx,by);x.stroke()});

  // the ball: graphite under-sketch, shadow smudge, wound strands, double ink outline
  x.strokeStyle='rgba(60,60,70,.28)';x.lineWidth=1;blob(bx-2.5*s,by-2*s,R*1.04,5,2.6*s);x.stroke();
  x.fillStyle='rgba(70,45,25,.14)';x.beginPath();x.ellipse(bx+R*.14,by+R*.22,R,R*.92,0,0,TAU);x.fill();
  blob(bx,by,R,0,1.6*s);x.fillStyle='#b8141f';x.fill();
  for(let k=0;k<12;k++){const e=.25+.7*hs(k,3.3),a0=k*1.37+dist/R*.9,rot=th+(k%4)*.45-.6;
    x.strokeStyle=['#e03a47','#8a0c18','#f06a70'][k%3];x.lineWidth=Math.max(1,1.5*s);x.beginPath();
    for(let q=0;q<=16;q++){const f=a0+q*.16,px=R*.96*Math.cos(f),py=R*.96*e*Math.sin(f);
      const X=bx+px*Math.cos(rot)-py*Math.sin(rot)+(hs(q+k*20,seed)-.5)*1.3*s,Y=by+px*Math.sin(rot)+py*Math.cos(rot)+(hs(q+k*20,seed+9)-.5)*1.3*s;q?x.lineTo(X,Y):x.moveTo(X,Y)}x.stroke()}
  x.strokeStyle='rgba(255,232,222,.4)';x.lineWidth=Math.max(1,1.4*s);x.beginPath();x.arc(bx,by,R*.68,3.6,4.6);x.stroke();
  x.strokeStyle='#4a0810';x.lineWidth=Math.max(1.2,1.7*s);blob(bx,by,R,1,2.2*s);x.stroke();
  x.lineWidth=Math.max(.8,1*s);blob(bx+s,by-s*.6,R*.99,2,2.6*s);x.stroke();
  requestAnimationFrame(frame)}


// ---- optional sound (off until tapped): a low drone, a thread-rustle that follows the turns, and soft plucks
const sbtn=document.createElement('button');sbtn.textContent='\u266a sound off';
sbtn.style.cssText='position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:9999;font:13px/1 monospace;letter-spacing:.08em;text-transform:uppercase;color:#4a0810;background:rgba(239,230,210,.9);border:2px solid #4a0810;padding:10px 16px;border-radius:999px;cursor:pointer';
document.body.appendChild(sbtn);
let AC,mg,rg,pl=0,on=false;const SC=[0,2,4,7,9];
function sInit(){AC=new(window.AudioContext||window.webkitAudioContext)();mg=AC.createGain();mg.gain.value=0;mg.connect(AC.destination);
  const dl=AC.createDelay(1);dl.delayTime.value=.42;const fb=AC.createGain();fb.gain.value=.35;const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1800;dl.connect(lp);lp.connect(fb);fb.connect(dl);lp.connect(mg);AC.dl=dl;
  [110,164.8].forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain(),l=AC.createBiquadFilter();o.type='sine';o.frequency.value=f;o.detune.value=i*5-3;g.gain.value=.05;l.type='lowpass';l.frequency.value=500;o.connect(l);l.connect(g);g.connect(mg);o.start()});
  const nb=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate),d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  const ns=AC.createBufferSource();ns.buffer=nb;ns.loop=true;const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=2600;bp.Q.value=.8;rg=AC.createGain();rg.gain.value=0;ns.connect(bp);bp.connect(rg);rg.connect(mg);ns.start()}
sbtn.onclick=()=>{if(!AC)sInit();on=!on;if(on)AC.resume();mg.gain.setTargetAtTime(on?.7:0,AC.currentTime,.2);sbtn.textContent=on?'\u266a sound on':'\u266a sound off'};
window.rtSound=(turn,spd,dt)=>{if(!on||!AC)return;rg.gain.setTargetAtTime(Math.min(.045,.004+Math.abs(turn)*.02),AC.currentTime,.15);pl-=dt;
  if(pl<=0){pl=1.1+Math.random()*1.4;const deg=Math.floor(((turn+1.4)/2.8)*SC.length+Math.random()*1.5),f=220*Math.pow(2,(SC[((deg%5)+5)%5]+12*(1+Math.floor(deg/5)%2))/12),t=AC.currentTime;
    const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.07,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+1.6);o.connect(g);g.connect(mg);g.connect(AC.dl);o.start(t);o.stop(t+1.7)}};
addEventListener('resize',size);size();
cv.addEventListener('pointerdown',e=>{down=true;ptr={x:e.clientX,y:e.clientY}});
cv.addEventListener('pointermove',e=>{if(down)ptr={x:e.clientX,y:e.clientY}});
addEventListener('pointerup',()=>down=false);addEventListener('pointercancel',()=>down=false);
requestAnimationFrame(frame);
</script>
</body>
</html>
