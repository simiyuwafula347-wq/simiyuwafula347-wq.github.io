<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Apps and Games — Larry Simiyu</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0720;--pink:#ff4fd8;--cyan:#38e8ff;--lime:#8dff6a}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:#d9d4ff;font:1.35rem/1.35 VT323,monospace}
a{color:var(--cyan)}
.hero{position:relative}
.hero img{width:100%;display:block;max-height:70svh;object-fit:cover;image-rendering:pixelated}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(#0b072000 50%,var(--bg))}
.hero a{position:absolute;z-index:2;top:1rem;left:1rem;font-size:1.1rem;background:#0b0720cc;padding:.3rem .7rem}
h1{font:400 clamp(1.5rem,7vw,3rem)/1.3 'Press Start 2P',monospace;color:var(--cyan);text-shadow:3px 3px 0 var(--pink);padding:0 1.25rem;margin:-1.5rem 0 1rem;position:relative;z-index:2}
main{max-width:60rem;margin:auto;padding:0 1.25rem 4rem}
.coin{font:400 .8rem 'Press Start 2P',monospace;color:var(--lime);animation:b 1s steps(2) infinite;margin:1.5rem 0}
@keyframes b{50%{opacity:0}}
@media(prefers-reduced-motion:reduce){.coin{animation:none}}
.shelf{display:grid;gap:1.2rem;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin:2rem 0}
.cart{background:#2b2a3d;border:3px solid #4a4868;border-radius:8px 8px 4px 4px;padding:.7rem;position:relative}
.cart:before{content:"";display:block;height:8px;width:40%;background:#14122a;margin:0 auto .6rem;border-radius:2px}
.scr{aspect-ratio:3/4;background:repeating-linear-gradient(0deg,#150f3a 0 3px,#1c1450 3px 6px);display:grid;place-items:center;text-align:center;padding:1rem;border:2px solid #000}
.scr b{font:400 .7rem/1.6 'Press Start 2P',monospace;color:var(--pink)}
.cart small{display:block;margin-top:.6rem;color:var(--lime)}
.btn{display:inline-block;font:400 .75rem 'Press Start 2P',monospace;background:var(--pink);color:#fff;padding:1rem 1.2rem;text-decoration:none;box-shadow:4px 4px 0 #000}
</style></head><body>
<div class="hero"><img src="img/shop-games.jpg" alt="Row of pixel-art game cartridges in a neon arcade"><a href="index.html#projects">‹ Shelf</a></div>
<h1>Apps &amp; Games</h1>
<main>
<p>Small games and useful apps that run right in the browser. No installs, no accounts. Each one lives on its own cartridge below.</p>
<p class="coin">INSERT COIN</p>
<div class="shelf">
<div class="cart"><div class="scr"><b>YOUR FIRST GAME</b></div><small>Add title and status</small></div>
<div class="cart"><div class="scr"><b>YOUR FIRST APP</b></div><small>Add title and status</small></div>
<div class="cart"><div class="scr"><b>LOADING...</b></div><small>In development</small></div>
</div>
<a class="btn" href="#">Get notified</a>
</main></body></html>
