<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Blurred City Puddle-Jump Kit | Larry’s Cove</title>
<meta name="description" content="A lo-fi music player UI: out-of-focus city lights, a pixel girl in a clear raincoat who splashes in a puddle to the beat, and a ripple-ring playhead.">
<meta name="theme-color" content="#0d1020">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=VT323&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d1020;--p:#171c33;--ink:#e8eefc;--dim:#8d9ac0;--pink:#ff6fa8;--cyan:#5ad7ff;--amber:#ffb45a;--head:"Silkscreen","Courier New",monospace;--body:"VT323","Courier New",monospace}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:22px/1.2 var(--body);display:grid;place-items:center;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.card{width:min(92vw,420px);background:var(--p);border:4px solid #36406a;box-shadow:8px 8px 0 #070914;padding:12px}
.scene{position:relative;display:grid;border:4px solid #070914;background:#070914;overflow:hidden}
.scene canvas{grid-area:1/1;width:100%;aspect-ratio:120/84;image-rendering:pixelated;display:block}
#bokeh{filter:blur(2.5px) saturate(1.25)}
#scene{cursor:pointer}
.say{position:absolute;font:12px var(--head);color:#fff;text-shadow:2px 2px 0 #070914;pointer-events:none;transform:translateX(-50%);animation:up 1.1s steps(8) forwards;white-space:nowrap}
@keyframes up{to{opacity:0;margin-top:-50px}}
.kick{font:10px var(--head);letter-spacing:.2em;color:var(--cyan);text-transform:uppercase;margin-top:12px}
h1{font:700 17px/1.2 var(--head);text-transform:uppercase;margin-top:4px}
.art{color:var(--dim)}
#bar{display:block;width:100%;height:56px;margin-top:6px;touch-action:none;cursor:pointer}
.times{display:flex;justify-content:space-between;color:var(--dim)}
.ctl{display:flex;justify-content:center;gap:12px;margin-top:10px}
.b{position:relative;overflow:hidden;width:74px;height:52px;border:0;cursor:pointer;display:grid;place-items:center;color:var(--ink);background:#2a3560;box-shadow:inset -4px -4px 0 #1b2347,0 5px 0 #070914}
.b.big{width:96px;background:#3a4a8a}.b:active{transform:translateY(3px);box-shadow:inset -4px -4px 0 #1b2347,0 2px 0 #070914}
.b svg{width:24px;height:24px;fill:currentColor}
.rip{position:absolute;left:50%;top:50%;width:8px;height:8px;border:3px solid var(--cyan);border-radius:50%;transform:translate(-50%,-50%);animation:rp .6s steps(6) forwards;pointer-events:none}
@keyframes rp{to{width:120px;height:120px;opacity:0}}
.ov{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:rgba(8,10,22,.9);text-align:center;padding:20px}
.ov[hidden]{display:none}
.go{font:13px var(--head);padding:13px 22px;margin-top:14px;background:var(--cyan);color:#08142a;border:0;cursor:pointer;text-transform:uppercase;box-shadow:inset -3px -3px 0 rgba(0,0,0,.25),inset 3px 3px 0 rgba(255,255,255,.35)}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<main class="card">
  <div class="scene" id="sc"><canvas id="bokeh" width="120" height="84"></canvas><canvas id="scene" width="120" height="84" aria-label="Pixel girl in a clear raincoat and yellow boots jumping into a puddle on a rainy city street"></canvas></div>
  <p class="kick">Blurred City Puddle-Jump Kit</p>
  <h1 id="tt">Gumboot Hop</h1>
  <p class="art" id="ar">Larry’s Cove</p>
  <canvas id="bar"></canvas>
  <div class="times"><span id="cur">0:00</span><span id="tot">0:00</span></div>
  <div class="ctl">
    <button class="b" id="prev" aria-label="Previous"><svg viewBox="0 0 8 8" shape-rendering="crispEdges" style="transform:scaleX(-1)"><path d="M0 0h2v8H0zM2 1h2v6H2zM4 2h2v4H4zM6 3h2v2H6z"/></svg></button>
    <button class="b big" id="play" aria-label="Play"><svg viewBox="0 0 8 8" shape-rendering="crispEdges" id="pi"><path d="M1 0h2v8H1zM3 1h2v6H3zM5 2h2v4H5z"/></svg></button>
    <button class="b" id="next" aria-label="Next"><svg viewBox="0 0 8 8" shape-rendering="crispEdges"><path d="M0 0h2v8H0zM2 1h2v6H2zM4 2h2v4H4zM6 3h2v2H6z"/></svg></button>
  </div>
</main>
<div class="ov" id="start"><div><p class="kick">Blurred City Puddle-Jump Kit</p><h1 style="font-size:22px;margin:10px 0">Rain on the city. One puddle.</h1><p class="art">Press play. She jumps on the beat.</p><button class="go" id="go">Tap to start</button></div></div>

<script>
const $=s=>document.querySelector(s);
/* TRACKS: demo tracks are generated by the page. For a real song add  src:"music/yoursong.mp3"  (t = title, a = artist, d = seconds,
   bpm = beats per minute so the jumps match your music). */
const TR=[{t:"Gumboot Hop",a:"Larry’s Cove",d:50,bpm:76,c:[130.8,164.8,196,246.9],s:[392,493.9,587.3,659.3]},
          {t:"Blue Hour Walk",a:"Larry’s Cove",d:46,bpm:68,c:[110,130.8,164.8,196],s:[329.6,392,440,523.3]},
          {t:"Neon Puddles",a:"Larry’s Cove",d:56,bpm:84,c:[146.8,174.6,220,261.6],s:[349.2,440,523.3,587.3]}];
let ti=0,pos=0,playing=false,ctx=null,pad,padG,nb,beatT=0,beatN=0;
const fmt=s=>Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0");

/* ---------- sound: rain air, soft pad, a gentle thump on the beat ---------- */
function audio(){
  if(ctx)return;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;ctx=new AC();
  const len=ctx.sampleRate*2;nb=ctx.createBuffer(1,len,ctx.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
  const n=ctx.createBufferSource();n.buffer=nb;n.loop=true;const f=ctx.createBiquadFilter();f.type="highpass";f.frequency.value=1800;
  const ng=ctx.createGain();ng.gain.value=.04;n.connect(f);f.connect(ng);ng.connect(ctx.destination);n.start();
  padG=ctx.createGain();padG.gain.value=0;const lp=ctx.createBiquadFilter();lp.type="lowpass";lp.frequency.value=700;padG.connect(lp);lp.connect(ctx.destination);
  pad=[0,1,2,3].map(i=>{const o=ctx.createOscillator();o.type=i%2?"triangle":"sine";o.connect(padG);o.start();return o});
  setInterval(pluck,1800);tune();
}
function tune(){if(ctx)pad.forEach((o,i)=>o.frequency.setTargetAtTime(TR[ti].c[i],ctx.currentTime,.5))}
function mix(){if(ctx)padG.gain.setTargetAtTime(playing&&!TR[ti].src?.06:0,ctx.currentTime,.3)}
function env(o,g,v,len){const t=ctx.currentTime;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+len);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+len+.05)}
function pluck(){if(!ctx||!playing||TR[ti].src)return;const o=ctx.createOscillator(),g=ctx.createGain();o.type="sine";o.frequency.value=TR[ti].s[Math.floor(Math.random()*4)];env(o,g,.06,1.3)}
function thump(){if(!ctx||!playing||TR[ti].src)return;const o=ctx.createOscillator(),g=ctx.createGain();o.type="sine";o.frequency.setValueAtTime(110,ctx.currentTime);o.frequency.exponentialRampToValueAtTime(45,ctx.currentTime+.12);env(o,g,.22,.22)}
function tick(){if(!ctx||!playing||TR[ti].src)return;const s=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=ctx.createGain();s.buffer=nb;f.type="highpass";f.frequency.value=6000;s.connect(f);f.connect(g);env(s,g,.05,.05)}

/* ---------- player ---------- */
const au=new Audio();au.preload="metadata";
au.addEventListener("loadedmetadata",()=>{if(TR[ti].src&&isFinite(au.duration)){TR[ti].d=au.duration;$("#tot").textContent=fmt(au.duration)}});
au.addEventListener("ended",()=>load(ti+1));
function load(i){ti=(i+TR.length)%TR.length;pos=0;beatT=0;beatN=0;$("#tt").textContent=TR[ti].t;$("#ar").textContent=TR[ti].a;$("#tot").textContent=fmt(TR[ti].d);tune();
  if(TR[ti].src){au.src=TR[ti].src;au.currentTime=0;if(playing)au.play().catch(()=>{})}else au.pause();mix()}
function setPlay(p){playing=p;if(TR[ti].src){p?au.play().catch(()=>{}):au.pause()}$("#pi").innerHTML=p?'<path d="M1 0h2v8H1zM5 0h2v8H5z"/>':'<path d="M1 0h2v8H1zM3 1h2v6H3zM5 2h2v4H5z"/>';mix()}
function rip(b){const r=document.createElement("span");r.className="rip";b.appendChild(r);setTimeout(()=>r.remove(),650)}
$("#play").onclick=e=>{rip(e.currentTarget);audio();if(ctx&&ctx.state==="suspended")ctx.resume();setPlay(!playing)};
$("#next").onclick=e=>{rip(e.currentTarget);load(ti+1)};
$("#prev").onclick=e=>{rip(e.currentTarget);pos>3?(pos=0,TR[ti].src&&(au.currentTime=0)):load(ti-1)};
setInterval(()=>{if(!playing)return;
  if(TR[ti].src)pos=au.currentTime;else{pos+=.05;if(pos>=TR[ti].d)return load(ti+1)}
  beatT+=.05;const bi=60/TR[ti].bpm;if(beatT>=bi){beatT-=bi;beatN++;onBeat()}},50);

/* ---------- the beat: she jumps every second beat; the landing splashes and sends ripples across the puddle ---------- */
const sc=$("#scene"),g=sc.getContext("2d"),bk=$("#bokeh"),bg=bk.getContext("2d"),W=120,H=84;
let jt=-1,jd=.5,drops=[],rings=[],rain=Array.from({length:34},()=>({x:Math.random()*W,y:Math.random()*H,v:1.4+Math.random()}));
function onBeat(){beatN%2?tick():thump();if(beatN%2===0&&jt<0){jt=0;jd=Math.min(.7,60/TR[ti].bpm*1.6)}ring(60);pulse=1}
let pulse=0;
function ring(x){rings.push({x,r:2,l:1})}
function splash(){for(let i=0;i<12;i++)drops.push({x:60+(Math.random()*8-4),y:68,vx:(Math.random()-.5)*2.4,vy:-1.4-Math.random()*1.6,l:1});ring(60);ring(60)}

/* blurred city: out-of-focus buildings and lights, drawn smooth and blurred by CSS */
const LIGHTS=Array.from({length:22},(_,i)=>({x:Math.random()*W,y:8+Math.random()*50,r:3+Math.random()*7,c:["#ffb45a","#ff6fa8","#5ad7ff","#b69cff","#ffe08a"][i%5],ph:Math.random()*6}));
const BLD=[[0,26,18],[16,18,22],[36,30,16],[54,22,20],[72,34,16],[88,20,18],[104,28,16]];
function city(t){bg.fillStyle="#0d1228";bg.fillRect(0,0,W,H);
  const gr=bg.createLinearGradient(0,0,0,H);gr.addColorStop(0,"#1b2150");gr.addColorStop(1,"#3b2447");bg.fillStyle=gr;bg.fillRect(0,0,W,H);
  BLD.forEach(b=>{bg.fillStyle="#0a0e22";bg.fillRect(b[0],b[1],b[2],66-b[1])});
  LIGHTS.forEach(l=>{const a=.45+.25*Math.sin(t+l.ph),gd=bg.createRadialGradient(l.x,l.y,0,l.x,l.y,l.r);gd.addColorStop(0,l.c);gd.addColorStop(1,"rgba(0,0,0,0)");bg.globalAlpha=a+pulse*.25;bg.fillStyle=gd;bg.beginPath();bg.arc(l.x,l.y,l.r,0,7);bg.fill()});
  bg.globalAlpha=1}

/* the girl: a clear raincoat over a coral dress, yellow gumboots */
const R=(c,x,y,w,h)=>{g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),w,h)};
function girl(y){const x=56;
  R("#f2c230",x+1,y+13,3,4);R("#f2c230",x+7,y+13,3,4);R("#c99a12",x+1,y+16,3,1);R("#c99a12",x+7,y+16,3,1);    // boots
  R("#f6c6a8",x+2,y+9,2,5);R("#f6c6a8",x+7,y+9,2,5);                                                      // legs
  R("#ee6a6a",x+1,y+5,9,6);                                                                                // dress
  R("rgba(170,215,245,.55)",x,y+3,11,10);R("rgba(210,235,250,.8)",x,y+3,1,10);R("rgba(210,235,250,.8)",x+10,y+3,1,10);R("rgba(210,235,250,.9)",x,y+12,11,1);   // clear coat
  R("#f6c6a8",x+3,y-3,5,6);R("#2a1a1a",x+2,y-5,7,3);R("#2a1a1a",x+2,y-2,1,5);R("#2a1a1a",x+8,y-2,1,5);R("#2a1a1a",x+4,y-1,1,1);R("#2a1a1a",x+6,y-1,1,1);   // head
  R("rgba(190,225,250,.45)",x+1,y-7,9,3);R("rgba(210,235,250,.8)",x+1,y-7,9,1);                              // hood
  const arm=jt>=0?-3:0;R("rgba(170,215,245,.7)",x-2,y+5+arm,2,5);R("rgba(170,215,245,.7)",x+11,y+5+arm,2,5)}
function scene(dt){
  g.clearRect(0,0,W,H);
  for(let y=64;y<H;y++)for(let x=0;x<W;x++){g.fillStyle=((x+y)%2&&y<70)?"#1d2340":"#141830";g.fillRect(x,y,1,1)}               // wet street
  g.fillStyle="rgba(255,255,255,.06)";for(let i=0;i<10;i++)g.fillRect((i*13+4)%W,66+(i%3)*5,6,1);
  for(let y=0;y<9;y++)for(let x=-34;x<=34;x++){const e=(x/34)**2+((y-4)/4.5)**2;if(e<=1){g.fillStyle=(x+y)%2?"#27355f":"#304273";if(e>.8)g.fillStyle="#3d4f8a";g.fillRect(60+x,66+y,1,1)}}   // puddle
  LIGHTS.slice(0,8).forEach(l=>{g.fillStyle=l.c;g.globalAlpha=.35;g.fillRect(Math.round(60+(l.x-60)*.5),68+(l.ph|0)%5,3,1);g.globalAlpha=1});   // light reflections
  rings=rings.filter(r=>(r.l-=dt*.9)>0);rings.forEach(r=>{r.r+=dt*26;g.fillStyle="rgba(190,230,255,"+(r.l*.8).toFixed(2)+")";for(let a=0;a<28;a++){const px=r.x+Math.cos(a/28*6.283)*r.r,py=70+Math.sin(a/28*6.283)*r.r*.2;if(Math.abs(px-60)<34&&py>66&&py<75)g.fillRect(Math.round(px),Math.round(py),1,1)}});
  let y0=50;if(jt>=0){jt+=dt;const u=jt/jd;if(u>=1){jt=-1;splash()}else y0=50-Math.sin(u*Math.PI)*18}
  girl(y0);
  drops=drops.filter(d=>(d.l-=dt*1.6)>0);drops.forEach(d=>{d.x+=d.vx;d.y+=d.vy;d.vy+=.2;g.fillStyle="rgba(210,240,255,.9)";g.fillRect(d.x|0,d.y|0,1,2)});
  g.fillStyle="rgba(190,215,255,.45)";rain.forEach(p=>{p.y+=p.v*1.6;p.x-=.5;if(p.y>H){p.y=-3;p.x=Math.random()*W}g.fillRect(p.x|0,p.y|0,1,3)});
  pulse=Math.max(0,pulse-dt*3)}

/* ---------- ripple-ring playhead: a puddle strip; rings spread from the playhead and pulse on every beat ---------- */
const bar=$("#bar"),bx=bar.getContext("2d");let barRings=[];
function bars(dt,now){const w=bar.clientWidth;if(bar.width!==w)bar.width=w;const h=56,fr=Math.min(pos/TR[ti].d,1),px=14+fr*(w-28),cy=h/2+4;bx.clearRect(0,0,w,h);
  bx.fillStyle="#1d2548";bx.beginPath();bx.ellipse(w/2,cy,w/2-3,15,0,0,7);bx.fill();
  bx.save();bx.beginPath();bx.ellipse(w/2,cy,w/2-3,15,0,0,7);bx.clip();bx.fillStyle="#3d5fa8";bx.fillRect(0,0,px,h);bx.fillStyle="rgba(255,255,255,.08)";for(let x=0;x<px;x+=8)bx.fillRect(x,cy-6,4,2);bx.restore();
  if(playing&&pulse>.95)barRings.push({r:4,l:1});
  barRings=barRings.filter(r=>(r.l-=dt*.8)>0);barRings.forEach(r=>{r.r+=dt*34;bx.strokeStyle="rgba(190,235,255,"+(r.l*.8).toFixed(2)+")";bx.lineWidth=2;bx.beginPath();bx.ellipse(px,cy,r.r,r.r*.38,0,0,7);bx.stroke()});
  bx.strokeStyle="#e8f6ff";bx.lineWidth=3;bx.beginPath();bx.ellipse(px,cy,6+Math.sin(now/300)*1.5,3,0,0,7);bx.stroke();
  $("#cur").textContent=fmt(pos)}
let drag=false;const seek=e=>{const r=bar.getBoundingClientRect();pos=Math.min(Math.max((e.clientX-r.left-14)/(r.width-28),0),1)*TR[ti].d;if(TR[ti].src)au.currentTime=pos};
bar.addEventListener("pointerdown",e=>{drag=true;seek(e)});addEventListener("pointermove",e=>{if(drag)seek(e)});addEventListener("pointerup",()=>drag=false);

/* ---------- loop + tapping ---------- */
let last=0;const loop=ms=>{const dt=Math.min(.1,(ms-last)/1000);if(ms-last>33){last=ms;city(ms/1000);scene(dt);bars(dt,ms)}requestAnimationFrame(loop)};
const LINES=["SPLASH!","puddle: 1  girl: 0","gumboots: engaged","mind the lamp post","jump jump jump"];let nl=0;
$("#sc").addEventListener("pointerdown",e=>{if(jt<0){jt=0;jd=.5}ring(60);const r=$("#sc").getBoundingClientRect(),s=document.createElement("span");s.className="say";s.textContent=LINES[nl++%LINES.length];s.style.left=(e.clientX-r.left)+"px";s.style.top=(e.clientY-r.top)+"px";$("#sc").appendChild(s);setTimeout(()=>s.remove(),1100)});
$("#go").onclick=()=>{$("#start").hidden=true;audio();if(ctx&&ctx.state==="suspended")ctx.resume();mix()};
load(0);requestAnimationFrame(loop);
</script>
</body>
</html>
