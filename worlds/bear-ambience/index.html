setInterval(()=>{if(!sess||ctx.state!=='running')return;const c=TRK[ti];while(nbT<ctx.currentTime+3){schedBar(sess,c,nb%BARS,nbT);nbT+=240/c.bpm;nb++}
  Q.sort((a,b)=>a.t-b.t);let k=0;while(Q.length&&Q[0].t<ctx.currentTime+1.6&&k++<10)Q.shift().fn()},50);
function startTrack(i,bar=0){if(sess)sess.stop();ti=i;sess=openBus(TRK[i]);NOTES.length=0;Q.length=0;nb=aB=bar;nbT=aT=ctx.currentTime+.15;if(!playing){playing=true;ctx.resume()}refresh()}
const posSec=()=>{if(!ctx||!sess)return 0;const bl=240/TRK[ti].bpm;return(((ctx.currentTime-aT)/bl+aB)%BARS+BARS)%BARS*bl};

/* ================= the bear: built from ellipses with dithered shading, wobbled row by row ================= */
const SW=60,SH=66,M=new Uint8Array(SW*SH),B4=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5],bay=(x,y)=>(B4[(y&3)*4+(x&3)]+.5)/16;
const px=(x,y,v)=>{x=Math.round(x);y=Math.round(y);if(x>=0&&y>=0&&x<SW&&y<SH)M[y*SW+x]=v};
function ell(cx,cy,rx,ry,v,sh){for(let y=Math.floor(cy-ry-1);y<=cy+ry+1;y++)for(let x=Math.floor(cx-rx-1);x<=cx+rx+1;x++){const dx=(x-cx)/rx,dy=(y-cy)/ry;if(dx*dx+dy*dy<=1){let k=v;if(sh){const l=-(dx*.65+dy*.75),b=bay(x,y);if(l>.35+(b-.5)*.5)k=sh[0];else if(l<-.3+(b-.5)*.5)k=sh[1]}px(x,y,k)}}}
const part=(cx,cy,rx,ry,v,sh)=>{ell(cx,cy,rx+1.3,ry+1.3,1);ell(cx,cy,rx,ry,v,sh)},FUR=[2,3,4];
(function(){for(let a=3.55;a<5.9;a+=.015){[23,26].forEach(r=>px(30+r*Math.cos(a),26+r*Math.sin(a),1));[24,25].forEach(r=>px(30+r*Math.cos(a),26+r*Math.sin(a),9))}   // headphone band
  part(10,11,8,8,2,[3,4]);part(50,11,8,8,2,[3,4]);ell(11,12,4,4,7);ell(49,12,4,4,7);
  part(30,50,17,15,2,[3,4]);ell(30,52,10,9,5,[5,6]);
  part(17,61,9,5,2,[3,4]);part(43,61,9,5,2,[3,4]);ell(17,62,4,2.5,7);ell(43,62,4,2.5,7);
  part(11,47,6,10,2,[3,4]);part(49,47,6,10,2,[3,4]);ell(11,55,2.6,2,7);ell(49,55,2.6,2,7);
  part(30,26,22,17,2,[3,4]);part(30,33,9,7,5,[5,6]);ell(30,29,3.2,2.2,8);px(29,28,12);
  [[30,31],[30,32],[29,33],[28,33],[27,32],[31,33],[32,33],[33,32]].forEach(p=>px(p[0],p[1],1));
  ell(16,31.5,2.5,1.5,7);ell(44,31.5,2.5,1.5,7);
  part(6,28,4.5,8,10,[10,11]);part(54,28,4.5,8,10,[10,11]);ell(6,28,2,4,9);ell(54,28,2,4,9);       // ear cups take the theme colour
  part(26,45,3,2.5,10,[10,11]);part(34,45,3,2.5,10,[10,11]);part(30,45,1.8,2,11);                    // bow tie
  for(let i=0;i<M.length;i++)if(M[i]===2&&hs(i%SW,(i/SW)|0)<.07)M[i]=(i&1)?3:4})();
const SPR=document.createElement('canvas');SPR.width=SW;SPR.height=SH;const sg=SPR.getContext('2d'),img=sg.createImageData(SW,SH);
const FC=[null,[58,36,23],[168,104,58],[201,140,85],[125,74,40],[240,217,176],[217,189,142],[232,160,160],[42,24,16],[43,43,51],null,null,[255,243,220]];
function sprite(A,eye){const pal=FC.slice();pal[10]=A;pal[11]=A.map(v=>v*.55);
  for(let i=0;i<M.length;i++){const k=M[i],c=k?pal[k]:null;img.data[i*4]=c?c[0]:0;img.data[i*4+1]=c?c[1]:0;img.data[i*4+2]=c?c[2]:0;img.data[i*4+3]=c?255:0}
  sg.putImageData(img,0,0);sg.fillStyle='#2a1810';
  [0,19].forEach(o=>{if(eye===0){sg.fillRect(20+o,21,2,5);sg.fillRect(19+o,22,4,3);sg.fillStyle='#fff3dc';sg.fillRect(20+o,22,1,1);sg.fillStyle='#2a1810'}
    else if(eye===1)sg.fillRect(19+o,24,4,1);else[[19,25],[20,24],[21,23],[22,24],[23,25],[20,25],[22,25]].forEach(p=>sg.fillRect(p[0]+o,p[1],1,1))})}

/* ================= ui ================= */
const cvS=$('#sc'),g=cvS.getContext('2d'),cvT=$('#thr'),tg=cvT.getContext('2d'),nzc=$('#nz').getContext('2d'),NZ=nzc.createImageData(64,64);NZ.data.fill(255);
const rgb=(a,al=1)=>`rgba(${a.map(Math.round)},${al})`;
let lastK='',sk='',cur=PAL[TH[0]].slice(1).map(a=>a.slice()),T=0,last=0,hit=0,tapT=0,en=0,drag=null,dpr=Math.min(2,devicePixelRatio||1),P=[];
const NOTE=['.###','..#.','..#.','##..','##..'];
function burst(n){for(let i=0;i<n;i++)P.push({x:42+(Math.random()-.5)*34,y:26+Math.random()*10,vx:(Math.random()-.5)*6,vy:-9-Math.random()*8,l:1,k:Math.random()<.5})}
$('#crt').addEventListener('pointerdown',()=>{tapT=1.3;hit=1.1;burst(5)});

const lad=[[0,1,2],[3,4,5]],steps=[];
lad.forEach((ids,s)=>ids.forEach((id,i)=>{const c=TRK[id],b=document.createElement('button');b.className='step';b.style.setProperty('--i',i);
  b.innerHTML=`<b>${id+1}</b><span><i></i><em>${NN[c.key%12]} ${MN[c.mode]} · ${c.bpm} bpm · ${fmt(dur(c))}</em></span><u></u>`;$('i',b).textContent=c.n;
  b.onclick=()=>{if(!ctx)return;startTrack(id);setTimeout(()=>DR.forEach(d=>snap(d,false)),280)};$('#l'+s).appendChild(b);steps[id]=b}));
PAL.forEach((p,i)=>{const b=document.createElement('button');b.className='sw';b.style.background=rgb(p[1]);b.setAttribute('aria-label',p[0]);
  b.onclick=()=>{TH[ti]=i;try{localStorage.setItem('lc-bear-themes',JSON.stringify(TH))}catch(e){}refresh()};$('#th').appendChild(b)});
function refresh(){const c=TRK[ti];$('#ti').textContent=c.n;$('#sub').textContent=`${NN[c.key%12]} ${MN[c.mode]} · ${c.bpm} bpm`;$('#tn').textContent=`${ti+1} / 6`;$('#du').textContent=fmt(dur(c));
  $('#cap').textContent=`theme · ${PAL[TH[ti]][0]} · saved for this song`;document.querySelectorAll('.sw').forEach((s,i)=>s.classList.toggle('on',i===TH[ti]));
  steps.forEach((s,i)=>{s.classList.toggle('on',i===ti);$('u',s).style.background=rgb(PAL[TH[i]][1])})}

// drawers: drag the tab, or tap it
const DR=[{side:-1,el:$('#dl'),tab:$('#tl')},{side:1,el:$('#dr'),tab:$('#tr')}],setX=(d,x)=>d.el.style.setProperty('--x',x+'px');
function snap(d,open){d.open=open;d.el.classList.remove('drag');setX(d,open?0:d.side*d.el.offsetWidth);$('#scrim').classList.toggle('on',DR.some(q=>q.open));if(open)DR.forEach(q=>{if(q!==d&&q.open)snap(q,false)})}
DR.forEach(d=>{let sx=0,base=0,mv=0;
  d.tab.addEventListener('pointerdown',e=>{d.tab.setPointerCapture(e.pointerId);sx=e.clientX;mv=0;base=d.open?0:d.side*d.el.offsetWidth;d.el.classList.add('drag')});
  d.tab.addEventListener('pointermove',e=>{if(!d.el.classList.contains('drag'))return;const dx=e.clientX-sx,W=d.el.offsetWidth;mv=Math.max(mv,Math.abs(dx));const x=base+dx;setX(d,d.side<0?Math.min(0,Math.max(-W,x)):Math.max(0,Math.min(W,x)))});
  d.tab.addEventListener('pointerup',()=>{if(!d.el.classList.contains('drag'))return;if(mv<6)snap(d,!d.open);else snap(d,Math.abs(parseFloat(d.el.style.getPropertyValue('--x'))||0)<d.el.offsetWidth*.55)})});
$('#scrim').addEventListener('pointerdown',()=>DR.forEach(d=>snap(d,false)));DR.forEach(d=>snap(d,false));

// controls
const icon=p=>$('#pi').innerHTML=p?'<path d="M1 0h2v8H1zM5 0h2v8H5z"/>':'<path d="M1 0h2v8H1zM3 1h2v6H3zM5 2h2v4H5z"/>';
$('#go').onclick=()=>{initAudio();$('#ov').hidden=true;startTrack(0);icon(true)};
$('#pl').onclick=()=>{if(!ctx)return;if(playing){ctx.suspend();playing=false}else{ctx.resume();playing=true}icon(playing)};
$('#tx').onclick=()=>{TEX=!TEX;$('#tx').style.opacity=TEX?1:.45;if(ctx)startTrack(ti,Math.floor(posSec()/(240/TRK[ti].bpm)))};
$('#nx').onclick=()=>ctx&&startTrack((ti+1)%6);$('#pv').onclick=()=>ctx&&startTrack((ti+5)%6);
const fr=e=>{const r=cvT.getBoundingClientRect();return Math.min(1,Math.max(0,(e.clientX-r.left-10)/(r.width-20)))};
cvT.addEventListener('pointerdown',e=>{if(!ctx)return;cvT.setPointerCapture(e.pointerId);drag=fr(e)});cvT.addEventListener('pointermove',e=>{if(drag!==null)drag=fr(e)});
cvT.addEventListener('pointerup',()=>{if(drag!==null&&ctx)startTrack(ti,Math.min(BARS-1,Math.floor(drag*BARS)));drag=null});

function thread(f){const w=cvT.clientWidth,h=34;if(cvT.width!==Math.round(w*dpr)){cvT.width=Math.round(w*dpr);cvT.height=h*dpr}
  tg.setTransform(dpr,0,0,dpr,0,0);tg.clearRect(0,0,w,h);const A=cur[0],x0=10,x1=w-10,pxp=x0+f*(x1-x0),cy=h/2;
  tg.lineCap=tg.lineJoin='round';tg.strokeStyle=rgb(A,.35);tg.lineWidth=1.6;tg.setLineDash([3,4]);tg.beginPath();                       // thread still to come: loose, dashed
  for(let x=pxp;x<=x1;x+=5)tg.lineTo(x,cy+Math.sin(x*.06+T*1.5));tg.stroke();tg.setLineDash([]);
  [[4,rgb(A.map(v=>v*.35),.7),0],[2.6,rgb(A),0],[1,rgb(A.map(v=>v+(255-v)*.55),.7),-.7]].forEach(([lw,c,o])=>{tg.strokeStyle=c;tg.lineWidth=lw;tg.beginPath();    // thread already used: taut, travelling wave
    for(let x=x0;x<=pxp;x+=4)tg.lineTo(x,cy+o+Math.sin(x*.08-T*3)*3.2*Math.min(1,(x-x0)/30));tg.lineTo(pxp,cy);tg.stroke()});
  tg.strokeStyle=rgb(A);tg.lineWidth=2;tg.beginPath();tg.arc(pxp,cy,4,0,TAU);tg.stroke();                                                    // knot + needle
  tg.strokeStyle='#fff3dc';tg.lineWidth=2;tg.beginPath();tg.moveTo(pxp+7,cy-11);tg.lineTo(pxp-3,cy+9);tg.stroke();tg.fillStyle='#fff3dc';tg.fillRect(pxp+5,cy-9,2,3)}

function frame(ms){if(ms-last<30){requestAnimationFrame(frame);return}const dt=Math.min(.05,(ms-last)/1000);last=ms;T+=dt;
  const tgt=PAL[TH[ti]].slice(1),root=document.documentElement.style;cur.forEach((c,k)=>c.forEach((_,j)=>c[j]+=(tgt[k][j]-c[j])*Math.min(1,dt*2.2)));
  const kk=cur.map(a=>a.map(Math.round)).join('|');if(kk!==lastK){lastK=kk;root.setProperty('--ar',cur[0].map(Math.round));root.setProperty('--br',cur[1].map(Math.round));root.setProperty('--cr',cur[2].map(Math.round));root.setProperty('--pgr',cur[1].map(v=>Math.round(v*.55)))}
  if(ctx){while(NOTES.length&&NOTES[0].t<=ctx.currentTime){const n=NOTES.shift();hit=Math.min(1.2,hit+.55*n.w);if(n.w>.5)burst(1)}
    an.getByteTimeDomainData(anD);let s=0;for(let i=0;i<256;i++){const v=(anD[i]-128)/128;s+=v*v}en+=(Math.sqrt(s/256)-en)*.2}
  hit=Math.max(0,hit-dt*2.4);tapT=Math.max(0,tapT-dt);
  const A=cur[0],eye=tapT>0?2:(T%4.3)<.14?1:0,sq=A.map(Math.round).join()+eye;if(sq!==sk){sk=sq;sprite(A,eye)}
  g.clearRect(0,0,84,84);g.fillStyle=rgb(cur[1].map(v=>v*.7));g.fillRect(0,0,84,84);
  const gr=g.createRadialGradient(42,38,0,42,38,46);gr.addColorStop(0,rgb(A,.18+en*1.6));gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(0,0,84,84);
  for(let i=0;i<24;i++){g.fillStyle=rgb(cur[2],.25+.5*Math.abs(Math.sin(T*.9+i)));g.fillRect(Math.floor(hs(i,1)*84),Math.floor((hs(i,2)*84+T*(2+hs(i,3)*4))%84),1,1)}
  g.fillStyle='rgba(0,0,0,.3)';g.beginPath();g.ellipse(42,78,20,3,0,0,TAU);g.fill();
  const lean=Math.sin(T*.9)*1.5,bob=Math.round(Math.sin(T*1.7));
  for(let y=0;y<SH;y++){const u=1-y/SH,dx=Math.round(Math.sin(T*2.1+y*.17)*2.2*u*u*(1+hit*1.4)+lean*u),dy=y<44?-Math.round(hit*2):0;g.drawImage(SPR,0,y,SW,1,12+dx,14+y+dy+bob,SW,1)}
  if(ctx&&an){g.fillStyle=rgb(A,.85);for(let i=0;i<128;i++){const r=38+(anD[i*2]-128)/128*5,a=i/128*TAU;g.fillRect(Math.round(42+Math.cos(a)*r),Math.round(42+Math.sin(a)*r),1,1)}}
  P=P.filter(p=>(p.l-=dt*.55)>0);P.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;g.fillStyle=rgb(p.k?A:cur[2],Math.min(1,p.l*1.6));NOTE.forEach((r,j)=>{for(let i=0;i<r.length;i++)if(r[i]==='#')g.fillRect(Math.round(p.x)+i,Math.round(p.y)+j,1,1)})});
  if(Math.floor(T*6)!==Math.floor((T-dt)*6)){for(let i=0;i<NZ.data.length;i+=4)NZ.data[i]=NZ.data[i+1]=NZ.data[i+2]=Math.random()*255;nzc.putImageData(NZ,0,0)}
  const c=TRK[ti],f=drag!==null?drag:posSec()/dur(c);thread(f);$('#cu').textContent=fmt(f*dur(c));
  requestAnimationFrame(frame)}
refresh();requestAnimationFrame(frame);
</script>
