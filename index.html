.scan{position:fixed;inset:0;pointer-events:none;opacity:var(--scan);background:repeating-linear-gradient(0deg,rgba(0,0,0,.4) 0 2px,transparent 2px 4px);z-index:9}

.avatar .in{width:100%;height:100%;background:var(--panel);display:grid;place-items:center}
.avatar svg{width:92px;height:auto}
.avatar.buzz{animation:buzz .35s steps(6)}
@keyframes bob{50%{transform:translateY(-8px)}}
@keyframes buzz{25%{transform:translate(-6px,2px) rotate(-6deg)}50%{transform:translate(6px,-2px) rotate(6deg)}75%{transform:translate(-4px,0) rotate(-3deg)}}

.bars i{width:8px;background:var(--accent);animation:eq .9s steps(5) infinite alternate;height:6px}
.bars i:nth-child(3n){animation-duration:.6s;background:var(--accent2)}.bars i:nth-child(2n){animation-duration:1.2s}

.cbar{width:7em;height:.7em;border:2px solid #fff1c9;padding:1px}.cbar b{display:block;height:100%;width:40%;background:#ff7aa8;animation:cp 12s steps(14) infinite}

    { title: "Wasp UI Kit", price: "$24",

/* ============================================================== */

const $ = s => document.querySelector(s);
const WASP = '<svg viewBox="-1 -1 28 18" shape-rendering="crispEdges" fill="var(--accent)"><path d="M10 0h2v1h-2zM13 0h2v1h-2zM9 1h5v1H9zM9 2h5v1H9zM8 3h7v1H8zM6 5h3v1H6zM5 6h5v1H5zM4 7h8v1H4zM3 8h10v1H3zM3 9h12v1H3zM4 10h11v1H4zM5 11h9v1H5zM6 12h3v1H6zM12 12h3v1h-3zM19 4h2v1h-2zM17 5h4v1h-4zM15 6h7v1h-7zM14 7h8v1h-8zM15 8h6v1h-6zM17 9h3v1h-3z"/><circle cx="19" cy="7" r=".9" fill="var(--bg)"/></svg>';
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function emblem(name){                                  // pixel emblem made from the product name
  let h = 2166136261; for (const ch of name) h = Math.imul(h ^ ch.charCodeAt(0), 16777619) >>> 0;
  let r = h || 1, rnd = () => (r = Math.imul(r ^ (r >>> 15), 2246822507) >>> 0, r / 4294967296), p = "";
  for (let y = 0; y < 8; y++){ const L = [0,1,2,3].map(() => rnd() < .5); [...L, ...L.slice().reverse()].forEach((on, x) => { if (on) p += `M${x} ${y}h1v1h-1z`; }); }
  return `<svg viewBox="0 0 8 8" shape-rendering="crispEdges"><path d="${p}"/></svg>`;
}

function build(){
  document.title = CONFIG.brand + " | pixels, UI, UX and ambience by Larry W.S.";
  $("#brand").textContent = CONFIG.brand; $("#by").textContent = CONFIG.by; $("#tagline").textContent = CONFIG.tagline;
  $("#foot").textContent = CONFIG.footer;
  $("#bars").innerHTML = Array.from({length: 14}, (_, i) => `<i style="animation-delay:${(i * .07).toFixed(2)}s"></i>`).join("");

      </div></div></article>`).join("") +
    `<div class="slot px"><b>INSERT NEXT PRODUCT</b>More packs are being drawn. Follow on Pinterest to see them first.</div>`;

  $("#apps").innerHTML = CONFIG.apps.map(a => `
    <article class="cart px"><div class="body px">
      <div class="emb px">${emblem(a.title)}</div>
      <div><h3>${esc(a.title)}</h3><p>${esc(a.desc)}</p><div class="meta"><span class="badge">${esc(a.status)}</span></div></div>
    </div></article>`).join("");

  const wa = "https://wa.me/" + CONFIG.whatsapp.replace(/\D/g, "") + "?text=" + encodeURIComponent(CONFIG.whatsappMsg);
  $("#talk").innerHTML = `
    <div class="card px"><div class="px">Questions, custom pixel work or support? Say hi.</div></div>

      <a class="btn px" href="${wa}" target="_blank" rel="noopener">WhatsApp <small>+${esc(CONFIG.whatsapp)}</small></a>
      <a class="btn ghost px" href="mailto:${esc(CONFIG.email)}">Email <small>${esc(CONFIG.email)}</small></a>
      <a class="btn ghost px" href="${esc(CONFIG.pinterest)}" target="_blank" rel="noopener">Pinterest <small>@Larrysmyl</small></a>
      <a class="btn ghost px" href="${esc(CONFIG.gumroad)}" target="_blank" rel="noopener">Gumroad <small>all downloads</small></a>
    </div>`;
}

function setTheme(t){
  document.documentElement.dataset.theme = t;
  document.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c.dataset.t === t));
  $("meta[name=theme-color]").content = getComputedStyle(document.body).backgroundColor;
  try { localStorage.setItem("we-theme", t); } catch (e) {}
}
function show(v){
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", t.dataset.v === v));
  document.querySelectorAll(".view").forEach(s => s.hidden = s.id !== v);
}
function say(text, x, y){ const f = document.createElement("span"); f.className = "fx"; f.textContent = text; f.style.left = x + "px"; f.style.top = y + "px"; document.body.appendChild(f); setTimeout(() => f.remove(), 1000); }

const LINES = ["BEAM ON!", "SHIP AHOY!", "MIND THE ROCKS!", "BZZT!", "STILL WATERS..."];
let taps = [];
function poke(e){
  const a = $("#avatar"), now = Date.now(), r = a.getBoundingClientRect();
  taps = taps.filter(t => now - t < 4000).concat(now);
  a.classList.remove("buzz"); void a.offsetWidth; a.classList.add("buzz");
  say(taps.length >= 10 ? "OKAY OKAY, STOP!" : LINES[taps.length % LINES.length], r.left + r.width / 2, r.top);
  if (taps.length >= 10) taps = [];
}
$("#avatar").addEventListener("click", poke);
$("#avatar").addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); poke(); } });
document.addEventListener("click", e => {
  const c = e.target.closest(".chip"); if (c) setTheme(c.dataset.t);
  const t = e.target.closest(".tab"); if (t) show(t.dataset.v);
});

(function(){

const N=64,cv=document.getElementById('pfp'),g=cv.getContext('2d');
let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const px=(x,y,c)=>{if(x<0||y<0||x>=N||y>=N)return;g.fillStyle=c;g.fillRect(x|0,y|0,1,1)};
const rect=(x,y,w,h,c)=>{for(let j=0;j<h;j++)for(let i=0;i<w;i++)px(x+i,y+j,c)};
const HZ=40;
// sky
const sky=['#0b1026','#111a3a','#1a2750','#25376b','#34508a','#4a6fa5'];
for(let y=0;y<HZ;y++){const t=y/HZ*6,i=Math.min(5,Math.floor(t)),f=t-Math.floor(t);
  for(let x=0;x<N;x++){px(x,y,(f>.75&&(x+y)%2==0&&i<5)?sky[i+1]:sky[i]);}}
// stars
for(let k=0;k<30;k++){const x=Math.floor(rnd()*N),y=Math.floor(rnd()*26);
  if(Math.hypot(x-42,y-15)<10)continue;px(x,y,rnd()>.8?'#ffd166':'#fff6d6');}
// lighthouse beam
for(let x=14;x<40;x++){const h=Math.floor((x-14)*.14)+1;
  for(let y=18-h;y<=18+h;y++)if((x+y)%2==0&&y<HZ)px(x,y,'#d9d6a0');}
// moon + glow
for(let y=0;y<N;y++)for(let x=0;x<N;x++){const d=Math.hypot(x-42,y-15);
  if(d<6.2)px(x,y,'#fff3c4');else if(d<9.5&&(x+y)%2==0)px(x,y,'#46598f');}
[[40,13],[44,16],[41,18],[43,12]].forEach(([x,y])=>px(x,y,'#e3d28f'));
// water
const wc=['#12304a','#0f2a40','#0c2236','#091a2b'];
for(let y=HZ;y<N;y++)rect(0,y,N,1,wc[Math.min(3,Math.floor((y-HZ)/6))]);
rect(0,HZ,N,1,'#2f5f80');
for(let k=0;k<26;k++){const y=HZ+2+Math.floor(rnd()*21),x=Math.floor(rnd()*N);rect(x,y,2+Math.floor(rnd()*3),1,'#24506d');}
[[38,8],[39,6],[40,6],[40,4],[41,4],[41,2]].forEach(([x,w],i)=>{});
[[41,43,9],[42,45,7],[43,47,6],[44,49,4],[45,51,3]].forEach(([x,y,w])=>rect(x-Math.floor(w/2)+1,y-2,w,1,y<46?'#fff3c4':'#c9c08a'));
// cliffs
for(let x=0;x<N;x++){
  let top=-1,bot=64;
  if(x<26){top=x<16?31:x<20?35:x<23?38:41;bot=x<8?64:x<14?58:x<20?52:47;}
  else if(x>=44){top=x>=58?28:x>=53?31:x>=49?35:39;bot=x>=56?64:x>=51?59:x>=47?53:48;}
  if(top<0)continue;
  rect(x,top,1,bot-top,'#070b16');px(x,top,'#1a2644');
  if((x*7)%5==0)px(x,top+3,'#10182c');
}

(function(){

const c=document.getElementById('cove'),x=c.getContext('2d');
const W=320,H=180,HZ=108;
const sky=['#150d33','#241450','#38206a','#562a80','#82378a','#bd4f86','#f08a7a'];
let seed=7;const rnd=()=>(seed=seed*16807%2147483647)/2147483647;
function R(col,a,b,w,h){x.fillStyle=col;x.fillRect(a|0,b|0,w,h)}
function layer(fn){const o=document.createElement('canvas');o.width=W;o.height=H;const g=x;const cx=o.getContext('2d');
  const old=x;fn(cx);return o}
function mk(fn){const o=document.createElement('canvas');o.width=W;o.height=H;fn(o.getContext('2d'));return o}
const A=mk(g=>{
  const bh=HZ/7;
  for(let y=0;y<HZ;y++){const b=Math.min(6,(y/bh)|0),pos=y-b*bh;
    for(let px=0;px<W;px++){let k=b;if(pos>bh-3&&b<6&&(px+y)%2)k=b+1;g.fillStyle=sky[k];g.fillRect(px,y,1,1)}}
  g.fillStyle='#ffe9a8';
  for(let dy=-14;dy<=14;dy++){const w=Math.round(Math.sqrt(196-dy*dy));g.fillRect(232-w,38+dy,w*2,1)}
  g.fillStyle='#e2c27a';[[-6,-4,3],[4,2,4],[-3,7,2],[6,-8,2]].forEach(([a,b,s])=>g.fillRect(232+a,38+b,s,s));
});
const B=mk(g=>{
  for(let px=0;px<W;px++){
    let top=null;
    if(px<100)top=70+Math.round(px*0.72/3)*3;
    else if(px>222)top=84+Math.round((319-px)*0.72/3)*3;
    if(top!==null){g.fillStyle='#0e0720';g.fillRect(px,top,1,H-top);g.fillStyle='#2f1a5e';g.fillRect(px,top,1,1)}
  }
  // little pixel pines on the left cliff
  [[8,62],[20,68],[34,76]].forEach(([a,b])=>{g.fillStyle='#0e0720';for(let i=0;i<4;i++)g.fillRect(a-2-i*2+2,b+i*4,5+i*4-2,4);g.fillRect(a,b+16,2,4)});
  // lantern on the right cliff
  g.fillStyle='#ffd23f';g.fillRect(262,86,3,4);g.fillStyle='#0e0720';g.fillRect(263,90,1,10);
});
const stars=Array.from({length:45},()=>({x:rnd()*W|0,y:rnd()*70|0,p:rnd()*6}));
const wb=['#2a1a66','#231659','#1c1250','#150d40'];
const P={k:'#1a1020',Y:'#ffd23f',w:'#cfeeff',E:'#ff4d6d'};
const F=[["..ww.......",".wwww......","kYYkYYkkkk.","kYYkYYkkEk.",".k..k..kk.."],
         ["...........","...........","kYYkYYkkkk.","kYYkYYkkEk.","wwww.k..kk."]];
const N=[".###",".#..",".#..","##..","##.."];
function spr(rows,pal,ox,oy,s,flip){rows.forEach((r,j)=>{for(let i=0;i<r.length;i++){const ch=r[i];if(ch==='.')continue;
  const ii=flip?r.length-1-i:i;R(typeof pal==='string'?pal:pal[ch],ox+ii*s,oy+j*s,s,s)}})}
let notes=[],last=0,spawn=0;
function burst(n,px,py){for(let i=0;i<n;i++)notes.push({x:px,y:py,vx:(Math.random()-.5)*30,vy:-12-Math.random()*20,c:Math.random()<.5?'#ff7aa8':'#7fe6ff',l:3})}
c.addEventListener('pointerdown',e=>{const r=c.getBoundingClientRect();burst(9,(e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H)});
const still=matchMedia('(prefers-reduced-motion:reduce)').matches;
function frame(ms){
  const t=still?2:ms/1000,dt=Math.min(.05,t-last);last=t;
  x.drawImage(A,0,0);
  stars.forEach(s=>{if(((t*1.5+s.p)|0)%3)R('#fff1c9',s.x,s.y,1,1)});
  for(let y=HZ;y<H;y++)R(wb[Math.min(3,((y-HZ)/18)|0)],0,y,W,1);
  for(let y=HZ+1;y<H;y+=3){for(let k=0;k<7;k++){const px=(k*47+y*13+t*(6+(y-HZ)*.25))%(W+20)-10;R('#6a55c0',px,y,5+((y-HZ)/12|0),1)}}
  for(let y=HZ+1;y<H-10;y+=2){const w=Math.max(2,14-((y-HZ)>>2)),sh=Math.round(Math.sin(t*2+y*.6)*2);R('#ffe9a8',232-w/2+sh,y,w,1)}
  x.drawImage(B,0,0);
  const wx=160+86*Math.sin(t*.6),wy=64+14*Math.sin(t*1.3),flip=Math.cos(t*.6)<0;
  spawn+=dt;if(spawn>.55){spawn=0;notes.push({x:wx,y:wy,vx:(flip?8:-8),vy:-9,c:Math.random()<.5?'#ff7aa8':'#7fe6ff',l:3})}
  R('rgba(0,0,0,.25)',wx,HZ+30+ (wy-64)*0.3,22,2);
  spr(F[((t*14)|0)%2],P,wx-11,wy,2,flip);
  notes=notes.filter(n=>(n.l-=dt)>0);
  notes.forEach(n=>{n.x+=n.vx*dt+Math.sin(t*4+n.y)*.15;n.y+=n.vy*dt;spr(N,n.c,n.x,n.y,1.6,false)});
  requestAnimationFrame(frame)
}
requestAnimationFrame(frame);

})();
