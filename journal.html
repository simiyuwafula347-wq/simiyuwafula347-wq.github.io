<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Journal — Larry Simiyu</title>
<meta name="description" content="Build logs, observations and quiet field notes from Larry Simiyu's studio.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Caveat:wght@600;700&family=Press+Start+2P&family=VT323&family=Quicksand:wght@500;700&family=Bebas+Neue&family=Archivo:wght@400;600;800;900&family=IBM+Plex+Mono:wght@400;500;700&family=Playfair+Display:ital,wght@0,700;0,900;1,500&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-root="">
<div class="wrap">
  <div class="topbar">
    <a class="btn alt" id="jBack" href="index.html">‹ Home</a>
    <div class="themes-mini" role="group" aria-label="Choose a theme">
      <button class="btn alt" data-set-theme="paper" type="button">1</button>
      <button class="btn alt" data-set-theme="pixel" type="button">2</button>
      <button class="btn alt" data-set-theme="muscovy" type="button">3</button>
      <button class="btn alt" data-set-theme="mancave" type="button">4</button>
      <button class="btn alt" data-set-theme="magazine" type="button">5</button>
      <button class="btn alt" data-set-theme="brutalist" type="button">6</button>
    </div>
  </div>
  <main id="jMain"></main>
</div>
<footer data-footer></footer>
<script src="data.js"></script>
<script src="studio.js"></script>
<script>
const TAGS = [["all", "All"], ["build log", "Build logs"], ["observation", "Observations"], ["field note", "Field notes"], ["poem", "Poems"], ["sketch", "Sketches"]];
const posts = POSTS.map((p, i) => ({ ...p, n: POSTS.length - i })).sort((a, b) => b.date.localeCompare(a.date) || a.n - b.n);
posts.forEach((p, i) => p.n = posts.length - i);          // No. 01 = oldest
const byId = id => posts.find(p => p.id === id);
const pad = n => String(n).padStart(2, "0");
const mm = p => mins(p.body);
const img = (p, cls) => p.cover ? `<div class="j-pic ${cls || ""}"><img src="${esc(ROOT + p.cover)}" alt="" loading="lazy"></div>` : "";
const SPANS = ["j-s7", "j-s5", "j-s4", "j-s4", "j-s4", "j-s5", "j-s7"];
let filter = "all";

function card(p, cls, i) {
  return `<a class="j-card ${cls}" href="#${esc(p.id)}" data-title="ENTRY_${pad(p.n)}.EXE">
    ${img(p)}
    <div class="j-body">
      <div class="j-row"><span class="j-no">No. ${pad(p.n)}</span><span class="j-tag">${esc(p.tag)}</span></div>
      <h3>${esc(p.title)}</h3>
      <p>${esc(p.dek || "")}</p>
      <div class="j-foot"><span>${esc(fmt(p.date))} · ${mm(p)} min</span><span class="j-go">Read →</span></div>
    </div></a>`;
}

/* Sections of the magazine. Rename "name" / "note" here whenever you find better names. */
const SECTIONS = [
  { id: "workshop",   name: "Workshop",   note: "Build logs and ideas",           tags: ["build log"],                  kind: "cards" },
  { id: "verse",      name: "Verse",      note: "Poems",                          tags: ["poem"],                       kind: "verse" },
  { id: "sketchbook", name: "Sketchbook", note: "Pages from the notebook",        tags: ["sketch"],                     kind: "tiles" },
  { id: "margins",    name: "Margins",    note: "Observations and field notes",   tags: ["observation", "field note"],  kind: "lines" }
];

function spans(n) {           // fills every row of the 12-column grid: 7+5, 5+7, 4+4+4, or one wide card
  const s = []; let rem = n, flip = false;
  while (rem > 0) {
    if (rem === 1) { s.push("j-s12"); rem = 0; }
    else if (rem === 3) { s.push("j-s4", "j-s4", "j-s4"); rem = 0; }
    else { s.push(flip ? "j-s5" : "j-s7", flip ? "j-s7" : "j-s5"); flip = !flip; rem -= 2; }
  }
  return s;
}
function sectionHTML(sec, list, n) {
  let inner = "";
  if (sec.kind === "cards") { const sp = spans(list.length); inner = `<div class="j-grid">${list.map((p, i) => card(p, sp[i])).join("")}</div>`; }
  else if (sec.kind === "verse") inner = `<div class="j-verses">${list.map(p => `<a class="j-verse" href="#${esc(p.id)}" data-title="VERSE_${pad(p.n)}.EXE">
      <span class="j-no">No. ${pad(p.n)}</span>
      <blockquote>${esc(p.pull || p.dek || "")}</blockquote>
      <h3>${esc(p.title)}</h3>
      <div class="j-foot"><span>${esc(fmt(p.date))} · ${mm(p)} min</span><span class="j-go">Read the poem →</span></div></a>`).join("")}</div>`;
  else if (sec.kind === "tiles") inner = `<div class="j-tiles">${list.map(p => `<a class="j-tile" href="#${esc(p.id)}">
      <img src="${esc(ROOT + p.cover)}" alt="" loading="lazy"><span class="j-cap"><b>${esc(p.title)}</b><small>${esc(fmt(p.date))}</small></span></a>`).join("")}${list.length < 3 ? `<div class="j-tile j-ghost"><span>More pages coming</span></div>` : ""}</div>`;
  else inner = `<div class="j-lines">${list.map(p => `<a class="j-line" href="#${esc(p.id)}">
      <span class="j-no">No. ${pad(p.n)}</span><span class="j-tag">${esc(p.tag)}</span>
      <span class="j-lt"><b>${esc(p.title)}</b><small>${esc(p.dek || "")}</small></span><span class="j-ld">${esc(fmt(p.date))}</span></a>`).join("")}</div>`;
  return `<section class="j-sec" id="sec-${sec.id}"><header class="j-sec-h"><span class="j-sec-no">§ ${pad(n)}</span><h2>${esc(sec.name)}</h2><p>${esc(sec.note)}</p><span class="j-sec-ct">${list.length} ${list.length === 1 ? "entry" : "entries"}</span></header>${inner}</section>`;
}

function renderIndex() {
  document.title = "Journal — Larry Simiyu";
  $("#jBack").href = "index.html"; $("#jBack").textContent = "‹ Home";
  const all = filter === "all";
  const cover = all ? (posts.find(p => p.pin) || posts[0]) : null;
  let html = `<header class="j-mast">
    <div class="j-issue"><span>Issue Nº 01</span><span>${posts.length} entries · ${SECTIONS.length} sections</span><span>Updated ${esc(fmt(posts[0].date))}</span></div>
    <h1 class="j-title">The Journal</h1>
    <p class="j-sub">Build logs, poems, sketches and quiet notes. An honest digital notebook, written as things happen.</p>
  </header>
  <div class="chips j-chips" role="group" aria-label="Filter entries">${TAGS.map(([k, n]) => `<button class="chip" type="button" data-f="${k}" aria-pressed="${k === filter}">${n}</button>`).join("")}</div>`;
  if (cover) html += `<a class="j-card j-lead" href="#${esc(cover.id)}" data-title="COVER_STORY.EXE">
      ${img(cover, "j-leadpic")}
      <div class="j-body">
        <div class="j-row"><span class="j-covertag">Cover story</span><span class="j-no">No. ${pad(cover.n)}</span><span class="j-tag">${esc(cover.tag)}</span>${cover.status ? `<span class="j-wip">${esc(cover.status)}</span>` : ""}</div>
        <h2>${esc(cover.title)}</h2>
        <p>${esc(cover.dek || "")}</p>
        <div class="j-foot"><span>${esc(fmt(cover.date))} · ${mm(cover)} min</span><span class="j-go">Read the entry →</span></div>
      </div></a>`;
  let n = 0;
  SECTIONS.forEach(sec => {
    const list = posts.filter(p => sec.tags.includes(p.tag) && (all || p.tag === filter) && p !== cover);
    if (list.length) html += sectionHTML(sec, list, ++n);
  });
  if (!n && !cover) html += `<p class="j-empty">Nothing here yet.</p>`;
  $("#jMain").innerHTML = html;
  $("#jMain").querySelectorAll("[data-f]").forEach(b => b.onclick = () => { filter = b.dataset.f; renderIndex(); });
}

const SKETCHPAGE = `<div class="sk-page" role="group" aria-label="A page from my sketchbook">
  <p class="sk-t sk-mont">I conceive that pleasures are to be avoided if greater pains to be coveted that will terminate greater pleasures. <b>Michel de Montaigne</b></p>
  <p class="sk-t sk-god">Wherever God gives you a responsibility, He also gives you the ability to meet that responsibility.</p>
  <img class="sk-garf" src="${ROOT}img/journal/sk-garfield.jpg" alt="Pen and colour drawing of Garfield in sunglasses, leaning on a table" loading="lazy">
  <div class="sk-bugs"><img src="${ROOT}img/journal/sk-bugs.jpg" alt="Pen drawing of Bugs Bunny in pixel sunglasses" loading="lazy"><span class="sk-t sk-ref">Isaiah 3:10</span></div>
  <p class="sk-t sk-plan">If you don’t have a plan for your life, someone else does.</p>
  <p class="sk-t sk-perc">We don’t believe what we hear; rather, we are certain that our perceptions are accurate.</p>
  <img class="sk-bear" src="${ROOT}img/journal/sk-bear.jpg" alt="Pen drawing of a bear in sunglasses with its arms crossed" loading="lazy">
  <p class="sk-t sk-find">Finding myself meant trading the roar of the world for whispers within. A quiet corner in a rain-drenched café, the aroma of coffee swirling around us as we explore the depths of our conversation that unravels the universe, that’s the dream. <b>— Larry</b></p>
  <span class="sk-t sk-sign">Larry</span>
</div>`;

function body(b) {
  let first = true;
  return b.split(/\n\n+/).map(p => {
    if (p.trim() === "{{sketchpage}}") return SKETCHPAGE;
    if (/^\|/.test(p)) return `<p class="j-stanza">${p.split("\n").map(l => esc(l.replace(/^\|\s?/, ""))).join("<br>")}</p>`;
    const m = p.match(/^!\[([^\]]*)\]\((img\/[\w\-./]+)\)$/);
    if (m) return `<figure class="j-fig"><img src="${esc(ROOT + m[2])}" alt="${esc(m[1])}" loading="lazy"><figcaption>${esc(m[1])}</figcaption></figure>`;
    let h = md(p);
    if (first && h.startsWith("<p>")) { first = false; h = '<p class="j-first">' + h.slice(3); }
    return h;
  }).join("");
}

function renderPost(p) {
  document.title = p.title + " — Larry Simiyu";
  $("#jBack").href = "#"; $("#jBack").textContent = "‹ All entries";
  const i = posts.indexOf(p), newer = posts[i - 1], older = posts[i + 1];
  $("#jMain").innerHTML = `<article class="j-article">
    <aside class="j-side box" data-title="ENTRY_${pad(p.n)}.EXE">
      <div class="j-bigno">${pad(p.n)}</div>
      <div><b>Kind</b><span class="j-tag">${esc(p.tag)}</span></div>
      <div><b>Date</b>${esc(fmt(p.date))}</div>
      <div><b>Reading</b>${mm(p)} min</div>
      ${p.status ? `<div><b>Status</b>${esc(p.status)}</div>` : ""}
    </aside>
    <div class="j-art">
      <h1>${esc(p.title)}</h1>
      <p class="j-dek">${esc(p.dek || "")}</p>
      ${body(p.body)}
      <nav class="j-pager">
        ${older ? `<a href="#${esc(older.id)}"><small>‹ Older</small>${esc(older.title)}</a>` : "<span></span>"}
        ${newer ? `<a href="#${esc(newer.id)}"><small>Newer ›</small>${esc(newer.title)}</a>` : "<span></span>"}
      </nav>
    </div></article>`;
}

function route() {
  const id = decodeURIComponent(location.hash.slice(1)), p = id && byId(id);
  if (p) renderPost(p); else renderIndex();
  scrollTo(0, 0);
}
addEventListener("hashchange", route);
$("#jBack").addEventListener("click", e => { if ($("#jBack").getAttribute("href") === "#") { e.preventDefault(); history.pushState(null, "", location.pathname); route(); } });
route();
</script>
</body>
</html>
