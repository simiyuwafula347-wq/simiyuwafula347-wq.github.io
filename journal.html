<body data-root="">
<div class="wrap">
  <nav class="topbar">
    <a class="btn alt" href="index.html">← Studio home</a>
    <div class="themes-mini" role="group" aria-label="Choose a theme">
      <button class="icon-btn" data-set-theme="paper" type="button">Paper</button>
      <button class="icon-btn" data-set-theme="pixel" type="button">Pixel</button>
      <button class="icon-btn" data-set-theme="muscovy" type="button">Muscovy</button>
    </div>
  </nav>
  <header class="page-hero" style="--c:#3b3a35"><div class="box" data-title="JOURNAL.EXE"><div class="code">CODE_004 //</div><h1>Journal</h1><p>Notes on how things get made. No schedule, no pressure.</p></div></header>
  <section id="jm"></section>
  <div class="box wob greet" id="greet" data-title="HELLO.EXE"></div>
  <footer data-footer></footer>
</div>
<script src="data.js"></script>
<script src="studio.js"></script>
<script>function route() {
  const h = location.hash.slice(1), L = [...POSTS].sort((a, b) => b.date.localeCompare(a.date));
  const i = L.findIndex(p => p.id === h), m = $("#jm");
  if (i > -1) {
    const p = L[i], pv = L[i + 1], nx = L[i - 1];
    document.title = p.title + " — Larry Simiyu";
    m.innerHTML = `<article class="box post" data-title="${esc(p.id.toUpperCase().slice(0, 24))}.TXT"><div class="meta">${fmt(p.date)} · ${mins(p.body)} min · #${esc(p.tag)}</div><h2>${inl(p.title)}</h2>${md(p.body)}</article>
      <div class="pn"><span>${pv ? `<a class="btn alt" href="#${pv.id}">‹ ${esc(pv.title)}</a>` : ""}</span><span>${nx ? `<a class="btn alt" href="#${nx.id}">${esc(nx.title)} ›</a>` : ""}</span></div>
      <p style="margin-top:16px"><a href="#">← all entries</a></p>`;
  } else {
    const t = h.startsWith("tag-") ? h.slice(4) : "", ps = t ? L.filter(p => p.tag === t) : L;
    document.title = "Journal — Larry Simiyu";
    m.innerHTML = `<div class="chips"><a class="chip" href="#" ${t ? "" : 'aria-pressed="true"'}>all</a>${[...new Set(L.map(p => p.tag))].map(x => `<a class="chip" href="#tag-${x}" ${x === t ? 'aria-pressed="true"' : ""}>#${x}</a>`).join("")}</div>
      <div class="cards">${ps.map(p => `<a class="item post-card" href="#${p.id}"><div class="txt"><span class="tag">${fmt(p.date)} · ${mins(p.body)} min · #${esc(p.tag)}</span><h3>${inl(p.title)}</h3><p>${esc(p.body.replace(/^[#>-] /gm, "").split("\n\n")[0].slice(0, 130))}…</p></div></a>`).join("")}</div>`;
  }
  scrollTo(0, 0);
}
addEventListener("hashchange", route); route();</script>
</body>
</html>
