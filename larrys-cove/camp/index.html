<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Campfire Cabin</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#04060b;overflow:hidden;font-family:"Courier New",monospace;color:#a8ffef;
    user-select:none;-webkit-user-select:none;touch-action:manipulation}
  body{display:flex;align-items:center;justify-content:center}
  #frame{width:min(96vw,calc(96vh * 1.7778));aspect-ratio:16/9;border:4px solid #1f3140;
    box-shadow:0 0 0 4px #04060b,0 0 0 6px #14212d,0 0 40px rgba(80,170,200,.18);background:#000}
  canvas{display:block;width:100%;height:100%;image-rendering:pixelated}
  .overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:10;padding:20px;
    background:rgba(4,6,11,.8);transition:opacity 1.2s ease}
  .overlay.hide{opacity:0;pointer-events:none;visibility:hidden;transition:opacity 1.2s ease,visibility 0s 1.2s}
  .box{padding:26px 36px;background:#07101a;border:4px solid #38c2f2;text-align:center;
    box-shadow:0 0 0 4px #07101a,0 0 0 8px #1a5a6e,0 0 40px rgba(56,194,242,.4)}
  h2{font-size:clamp(.9rem,4.4vw,1.4rem);letter-spacing:.26em;margin-bottom:20px;color:#c9f4ff;text-shadow:0 0 10px #38c2f2}
  .sub{font-size:.7rem;letter-spacing:.2em;opacity:.55;margin-top:16px}
  button{background:#0c2233;color:#7df9ff;border:3px solid #38c2f2;padding:10px 28px;font-family:inherit;font-size:1rem;letter-spacing:.25em;cursor:pointer}
  button:active{transform:translateY(2px)}
  #home{position:fixed;left:8px;top:6px;z-index:30;color:#38c2f2;opacity:.12;font-size:18px;text-decoration:none;padding:4px 8px}
  #home:hover{opacity:.7}
  #devdot{position:fixed;right:6px;bottom:6px;width:12px;height:12px;border:1px solid #38c2f2;opacity:.1;cursor:pointer;z-index:30}
  #devdot:hover{opacity:.5}
  #dev{position:fixed;right:8px;bottom:26px;z-index:30;display:none;background:rgba(3,8,16,.9);border:1px solid #1a5a6e;
    padding:8px 10px;font-size:11px;letter-spacing:.08em;line-height:1.7}
  #dev.on{display:block}
  #dev button{padding:3px 8px;font-size:11px;letter-spacing:.1em;margin:2px 2px 0 0;border-width:1px}
  #err{position:fixed;inset:0;z-index:50;display:none;padding:20px;background:#000;color:#ff8a8a;font-size:12px;white-space:pre-wrap;overflow:auto}
</style>
</head>
<body>

<div id="frame"><canvas id="gl" width="160" height="90"></canvas></div>
<a id="home" href="../index.html" title="back to the cove">&lsaquo;</a>

<div id="start" class="overlay">
  <div class="box">
    <h2>CAMPFIRE CABIN</h2>
    <button id="btn-start">BEGIN</button>
    <div class="sub">HEADPHONES RECOMMENDED</div>
  </div>
</div>

<div id="devdot" title="controls (S)"></div>
<div id="dev">
  <div id="devinfo">--</div>
  <button id="dev-jump">JUMP [N]</button>
  <button id="dev-speed">SPEED x1</button>
  <button id="dev-mute">MUTE [M]</button>
  <button id="dev-sleep">SLEEP: OFF</button>
</div>
<pre id="err"></pre>

<script id="vs" type="x-shader/x-vertex">
attribute vec2 a_pos;
void main(){ gl_Position = vec4(a_pos, 0.0, 1.0); }
</script>

<script id="fs" type="x-shader/x-fragment">
precision highp float;

uniform float u_time, u_night, u_aurora, u_shoot, u_owl, u_fade;
uniform float u_cx, u_cmode, u_cdir, u_cswing, u_fx, u_fmode, u_fdir, u_fswing, u_fire;
uniform vec3 u_skyTop, u_skyBot, u_glow;

float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123); }
float noise(vec2 p){
  vec2 i = floor(p); vec2 f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), u.x),
             mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x), u.y);
}
float fbm(vec2 p){
  float v = 0.0; float a = 0.5;
  for (int i = 0; i < 4; i++){ v += a * noise(p); p = p * 2.03 + vec2(1.7, 9.2); a *= 0.5; }
  return v;
}
float bayer2(vec2 a){ a = floor(a); return fract(a.x / 2.0 + a.y * a.y * 0.75); }
float bayer4(vec2 a){ return bayer2(0.5 * a) * 0.25 + bayer2(a); }
float rect(vec2 q, vec2 lo, vec2 sz){
  vec2 a = step(lo, q);
  vec2 b = 1.0 - step(lo + sz, q);
  return a.x * a.y * b.x * b.y;
}
vec4 layer(vec4 base, float m, vec3 c){ return vec4(mix(base.rgb, c, m), max(base.a, m)); }

float ridge(float x){ return 47.0 + 9.0 * noise(vec2(x * 0.035, 3.0)) + 4.0 * noise(vec2(x * 0.11, 7.0)); }
float farPines(float x){ return 50.0 + 5.0 * hash(vec2(floor(x / 6.0), 4.0)) - abs(fract(x / 6.0) - 0.5) * 12.0; }

vec3 aurora(vec2 p){
  float flow = fbm(vec2(p.x * 0.025, u_time * 0.04));
  float bandY = 68.0 + 7.0 * sin(p.x * 0.045 + u_time * 0.08) + flow * 10.0;
  float d = (p.y - bandY) / 9.0;
  float rays = 0.45 + 0.55 * noise(vec2(p.x * 0.35, u_time * 0.25));
  vec3 c = mix(vec3(0.15, 1.0, 0.55), vec3(0.75, 0.35, 0.95), smoothstep(-0.3, 1.4, d));
  return c * exp(-d * d) * rays * u_aurora * 0.55;
}

vec3 skyAt(vec2 p){
  float k = clamp((p.y - 46.0) / 44.0, 0.0, 1.0);
  vec3 c = mix(u_skyBot, u_skyTop, pow(k, 0.7));
  c += u_glow * exp(-max(p.y - 46.0, 0.0) * 0.11);
  float h = hash(p);
  c += vec3(0.85, 0.92, 1.0) * step(0.984, h) * (0.55 + 0.45 * sin(u_time * 2.5 + h * 60.0)) * u_night * smoothstep(50.0, 66.0, p.y);
  float md = length(p - vec2(120.0, 64.0));
  float moon = step(md, 5.0) * (1.0 - step(length(p - vec2(122.2, 65.2)), 4.3));
  c = mix(c, vec3(0.97, 0.95, 0.8), moon * smoothstep(0.1, 0.5, u_night));
  c += vec3(0.5, 0.6, 0.85) * exp(-md * 0.1) * 0.16 * u_night;
  c += aurora(p);
  vec2 dir = normalize(vec2(-1.0, -0.4));
  vec2 r = p - (vec2(150.0, 88.0) + dir * u_shoot * 85.0);
  float al = dot(r, -dir);
  float pr = abs(dot(r, vec2(-dir.y, dir.x)));
  c += vec3(0.95, 0.98, 1.0) * step(0.0, al) * step(al, 16.0) * (1.0 - step(0.8, pr)) * (1.0 - al / 16.0) * step(0.0, u_shoot);
  return c;
}

float pine(vec2 q, float cx, float base, float H){
  float rel = q.y - base;
  float inY = step(7.0, rel) * step(rel, H);
  float tier = fract(rel / 8.0);
  float w = (1.0 - rel / H) * 9.0 * (0.55 + 0.45 * (1.0 - tier)) + 1.0;
  float trunk = step(abs(q.x - cx), 1.0) * step(0.0, rel) * step(rel, 8.0);
  return clamp(inY * step(abs(q.x - cx), w) + trunk, 0.0, 1.0);
}

vec4 camperSit(vec2 q){
  vec4 r = vec4(0.0);
  vec3 jacket = vec3(0.88, 0.42, 0.18);
  vec3 jdark  = vec3(0.62, 0.28, 0.12);
  vec3 jeans  = vec3(0.15, 0.20, 0.36);
  vec3 skin   = vec3(0.96, 0.76, 0.62);
  r = layer(r, rect(q, vec2(-2.0, 0.0), vec2(10.0, 3.0)), vec3(0.30, 0.18, 0.10));       // log seat
  r = layer(r, rect(q, vec2(6.0, 0.0), vec2(2.0, 5.0)), jeans);                           // shin
  r = layer(r, rect(q, vec2(6.0, 3.0), vec2(1.0, 1.0)) * 0.0, jeans);
  r = layer(r, rect(q, vec2(6.0, 0.0), vec2(3.0, 1.0)), vec3(0.20, 0.11, 0.06));          // boot
  r = layer(r, rect(q, vec2(1.0, 3.0), vec2(6.0, 2.0)), jeans);                           // thigh
  r = layer(r, rect(q, vec2(0.0, 4.0), vec2(5.0, 5.0)), jacket);                          // torso + shoulders
  r = layer(r, rect(q, vec2(0.0, 4.0), vec2(1.0, 5.0)), jdark);                           // shaded back
  r = layer(r, rect(q, vec2(0.0, 9.0), vec2(5.0, 1.0)), vec3(0.20, 0.62, 0.60));          // scarf
  r = layer(r, rect(q, vec2(1.0, 10.0), vec2(4.0, 4.0)), skin);                           // head
  r = layer(r, rect(q, vec2(4.0, 12.0), vec2(1.0, 1.0)), vec3(0.08));                     // eye
  r = layer(r, rect(q, vec2(1.0, 13.0), vec2(4.0, 2.0)), vec3(0.72, 0.14, 0.22));         // beanie
  r = layer(r, rect(q, vec2(2.0, 15.0), vec2(2.0, 1.0)), vec3(0.95, 0.9, 0.8));           // bobble
  r = layer(r, rect(q, vec2(2.0, 5.0), vec2(2.0, 3.0)), vec3(0.97, 0.52, 0.24));          // upper arm
  r = layer(r, rect(q, vec2(4.0, 6.0), vec2(3.0, 2.0)), vec3(0.97, 0.52, 0.24));          // forearm
  r = layer(r, rect(q, vec2(7.0, 5.0), vec2(2.0, 3.0)), vec3(0.93, 0.91, 0.84));          // mug
  r = layer(r, rect(q, vec2(7.0, 7.0), vec2(2.0, 1.0)), vec3(0.28, 0.16, 0.10));          // coffee
  return r;
}
vec4 camperWalk(vec2 q, float sw){
  vec4 r = vec4(0.0);
  vec3 jacket = vec3(0.88, 0.42, 0.18);
  vec3 jeans  = vec3(0.15, 0.20, 0.36);
  vec3 skin   = vec3(0.96, 0.76, 0.62);
  r = layer(r, rect(q, vec2(1.0 + sw, 0.0), vec2(2.0, 4.0)), jeans);                      // legs
  r = layer(r, rect(q, vec2(3.0 - sw, 0.0), vec2(2.0, 4.0)), jeans * 0.8);
  r = layer(r, rect(q, vec2(1.0 + sw, 0.0), vec2(2.0, 1.0)) + rect(q, vec2(3.0 - sw, 0.0), vec2(2.0, 1.0)), vec3(0.20, 0.11, 0.06));   // boots
  r = layer(r, rect(q, vec2(0.0, 4.0), vec2(6.0, 5.0)), jacket);                          // torso + shoulders
  r = layer(r, rect(q, vec2(0.0, 4.0), vec2(1.0, 5.0)), vec3(0.62, 0.28, 0.12));
  r = layer(r, rect(q, vec2(0.0, 9.0), vec2(6.0, 1.0)), vec3(0.20, 0.62, 0.60));          // scarf
  r = layer(r, rect(q, vec2(1.0, 10.0), vec2(4.0, 4.0)), skin);                           // head
  r = layer(r, rect(q, vec2(4.0, 12.0), vec2(1.0, 1.0)), vec3(0.08));
  r = layer(r, rect(q, vec2(1.0, 13.0), vec2(4.0, 2.0)), vec3(0.72, 0.14, 0.22));         // beanie
  r = layer(r, rect(q, vec2(2.0, 15.0), vec2(2.0, 1.0)), vec3(0.95, 0.9, 0.8));
  r = layer(r, rect(q, vec2(2.0 + sw, 4.0), vec2(2.0, 4.0)), vec3(0.97, 0.52, 0.24));     // swinging arm
  return r;
}
// the fox faces left; the caller mirrors it when it walks away
vec4 foxSit(vec2 q, float tw){
  vec4 r = vec4(0.0);
  vec3 f = vec3(0.92, 0.45, 0.14);
  r = layer(r, rect(q, vec2(3.0, 0.0), vec2(6.0, 5.0)), f);
  r = layer(r, rect(q, vec2(3.0, 0.0), vec2(2.0, 4.0)), vec3(0.95, 0.92, 0.85));
  r = layer(r, rect(q, vec2(9.0, 0.0), vec2(4.0, 2.0)), f);
  r = layer(r, rect(q, vec2(12.0, 2.0 + tw), vec2(1.0, 2.0)), f);
  r = layer(r, rect(q, vec2(12.0, 3.0 + tw), vec2(1.0, 1.0)), vec3(0.95, 0.92, 0.85));
  r = layer(r, rect(q, vec2(0.0, 5.0), vec2(5.0, 4.0)), f);
  r = layer(r, rect(q, vec2(0.0, 5.0), vec2(2.0, 1.0)), vec3(0.95, 0.92, 0.85));
  r = layer(r, rect(q, vec2(1.0, 9.0), vec2(1.0, 2.0)) + rect(q, vec2(4.0, 9.0), vec2(1.0, 2.0)), vec3(0.30, 0.14, 0.08));
  r = layer(r, rect(q, vec2(0.0, 6.0), vec2(1.0, 1.0)), vec3(0.05));
  r = layer(r, rect(q, vec2(2.0, 7.0), vec2(1.0, 1.0)), vec3(0.05));
  return r;
}
vec4 foxWalk(vec2 q, float sw){
  vec4 r = vec4(0.0);
  vec3 f = vec3(0.92, 0.45, 0.14);
  vec3 dk = vec3(0.28, 0.13, 0.08);
  r = layer(r, rect(q, vec2(3.0 + sw, 0.0), vec2(1.0, 2.0)) + rect(q, vec2(5.0 - sw, 0.0), vec2(1.0, 2.0)) + rect(q, vec2(9.0 + sw, 0.0), vec2(1.0, 2.0)) + rect(q, vec2(10.0 - sw, 0.0), vec2(1.0, 2.0)), dk);
  r = layer(r, rect(q, vec2(3.0, 2.0), vec2(8.0, 4.0)), f);
  r = layer(r, rect(q, vec2(11.0, 4.0), vec2(4.0, 2.0)), f);
  r = layer(r, rect(q, vec2(14.0, 4.0), vec2(1.0, 2.0)), vec3(0.95, 0.92, 0.85));
  r = layer(r, rect(q, vec2(0.0, 4.0), vec2(4.0, 4.0)), f);
  r = layer(r, rect(q, vec2(0.0, 8.0), vec2(1.0, 2.0)) + rect(q, vec2(3.0, 8.0), vec2(1.0, 2.0)), dk);
  r = layer(r, rect(q, vec2(0.0, 5.0), vec2(1.0, 1.0)), vec3(0.05));
  r = layer(r, rect(q, vec2(1.0, 6.0), vec2(1.0, 1.0)), vec3(0.05));
  return r;
}

void main(){
  vec2 px = floor(gl_FragCoord.xy);
  float x = px.x;
  float y = px.y;
  float t = u_time;
  vec3 col;

  float flick = 0.85 + 0.15 * sin(t * 13.0) * sin(t * 7.0);
  float fireGlow = exp(-length((px - vec2(100.0, 14.0)) * vec2(1.0, 1.5)) * 0.055) * u_fire * flick;
  vec3 warm = vec3(0.65, 0.30, 0.09);
  float bankTop = 24.0 + 1.5 * sin(x * 0.08);
  float m1 = ridge(x);
  vec3 mtnC = mix(u_skyBot, vec3(0.03, 0.05, 0.12), 0.75);

  if (y >= 46.0){
    col = skyAt(px);
    col = mix(col, mtnC, step(y, m1));
    col = mix(col, vec3(0.015, 0.03, 0.05), step(y, farPines(x)));
  } else if (y >= bankTop){
    // lake: mirrored sky, mountains and pines with a gentle ripple
    float rip = sin(y * 1.3 + t * 1.1 + x * 0.05) * 1.5 + floor(sin(y * 0.7 - t * 0.6) * 1.2);
    vec2 rp = vec2(x + rip, 92.0 - y);
    vec3 rc = skyAt(rp) * 0.7 + vec3(0.0, 0.015, 0.03);
    rc = mix(rc, mtnC * 0.8, step(rp.y, ridge(rp.x)));
    rc = mix(rc, vec3(0.01, 0.02, 0.04), step(rp.y, farPines(rp.x)));
    rc += vec3(0.5, 0.6, 0.8) * step(0.86, fract(y * 0.37 + t * 0.12 + sin(x * 0.07) * 0.2)) * 0.05 * (0.5 + 0.5 * u_night);
    col = rc + warm * exp(-(y - 24.0) * 0.25) * fireGlow * 0.5;
  } else {
    // the bank
    vec3 g = vec3(0.045, 0.07, 0.05) * (0.7 + 0.3 * hash(px));
    g = mix(g, vec3(0.07, 0.10, 0.06), step(0.9, hash(px * 1.7)) * 0.6);
    float dd = length((px - vec2(100.0, 10.0)) * vec2(0.7, 1.2));
    g = mix(g, vec3(0.14, 0.10, 0.07), 1.0 - smoothstep(10.0, 15.0, dd));
    col = g * (1.0 - 0.5 * u_night) + vec3(0.05, 0.07, 0.14) * u_night * 0.25 + warm * fireGlow * 0.9;
  }

  // pines
  vec3 pineC = vec3(0.015, 0.04, 0.05) + warm * fireGlow * 0.5 + vec3(0.02, 0.03, 0.05) * (1.0 - u_night);
  float pm = pine(px, 4.0, 8.0, 46.0) + pine(px, 56.0, 12.0, 30.0) + pine(px, 70.0, 9.0, 36.0)
           + pine(px, 134.0, 8.0, 40.0) + pine(px, 152.0, 6.0, 52.0);
  col = mix(col, pineC, clamp(pm, 0.0, 1.0));

  // the cabin
  float roofY = 28.0 + (20.0 - abs(x - 28.0)) * 0.55;
  float wallM = rect(px, vec2(10.0, 10.0), vec2(36.0, 18.0));
  float roofM = step(28.0, y) * step(y, roofY) * step(abs(x - 28.0), 20.0);
  float dayL = 1.0 - 0.55 * u_night;
  vec3 wallC = vec3(0.22, 0.12, 0.07) * (1.0 - 0.18 * step(0.5, fract(y / 3.0))) * dayL + warm * fireGlow * 0.25;
  col = mix(col, wallC, wallM);
  col = mix(col, vec3(0.11, 0.06, 0.05) * dayL + warm * fireGlow * 0.15, roofM);
  col = mix(col, vec3(0.20, 0.17, 0.18) * dayL, rect(px, vec2(38.0, 32.0), vec2(4.0, 13.0)) * (1.0 - wallM));
  col = mix(col, vec3(0.07, 0.04, 0.03), rect(px, vec2(35.0, 10.0), vec2(6.0, 15.0)));
  float winL = 0.45 + 0.55 * u_night;
  vec3 winC = vec3(1.0, 0.72, 0.30) * (0.85 + 0.15 * flick) * winL;
  col += vec3(1.0, 0.6, 0.2) * exp(-length(px - vec2(21.0, 19.5)) * 0.13) * 0.22 * winL;
  col = mix(col, winC, rect(px, vec2(17.0, 16.0), vec2(8.0, 7.0)));
  col = mix(col, vec3(0.20, 0.11, 0.07), rect(px, vec2(20.0, 16.0), vec2(1.0, 7.0)) + rect(px, vec2(17.0, 19.0), vec2(8.0, 1.0)));

  // chimney smoke
  float sy = y - 45.0;
  float sx = 40.0 + sin(t * 0.5 + sy * 0.15) * 3.0 + sy * 0.2;
  float sm = step(0.0, sy) * step(sy, 28.0) * step(abs(x - sx), 1.5 + sy * 0.1) * step(bayer4(px), 0.55 - sy * 0.018);
  col = mix(col, vec3(0.42, 0.44, 0.55) * (0.5 + 0.5 * (1.0 - u_night)), sm * 0.55);

  // the campfire
  vec2 fp = px - vec2(100.0, 12.0);
  col = mix(col, vec3(0.30, 0.30, 0.34) + warm * fireGlow * 0.4, rect(px, vec2(94.0, 9.0), vec2(13.0, 2.0)));
  col = mix(col, vec3(0.16, 0.09, 0.05) + warm * fireGlow * 0.3, rect(px, vec2(95.0, 11.0), vec2(11.0, 2.0)) + rect(px, vec2(97.0, 12.0), vec2(8.0, 2.0)));
  float fh = 5.0 + 9.0 * u_fire;
  float fw = (1.0 - fp.y / fh) * 4.5 * (1.0 + 0.25 * sin(t * 9.0 + fp.y * 0.8));
  float fwob = sin(t * 7.0 + fp.y * 0.5) * 1.2;
  float inside = step(1.0, fp.y) * step(fp.y, fh) * step(abs(fp.x - fwob), fw);
  float it = 1.0 - abs(fp.x - fwob) / max(fw, 0.01) * 0.7 - fp.y / (fh * 1.15) + (fbm(px * 0.15 + vec2(0.0, -t * 1.5)) - 0.5) * 0.5;
  float ff = it - bayer4(px) * 0.3;
  vec3 fc = vec3(0.8, 0.12, 0.05);
  fc = mix(fc, vec3(1.0, 0.5, 0.1), step(0.25, ff));
  fc = mix(fc, vec3(1.0, 0.9, 0.4), step(0.55, ff));
  col = mix(col, fc, inside * step(0.0, ff));
  for (int i = 0; i < 8; i++){
    float fi = float(i);
    float h = hash(vec2(fi, 3.0));
    float ps = fract(t * (0.22 + h * 0.22) + h * 5.0);
    vec2 spk = floor(vec2(100.0 + (h - 0.5) * 8.0 + sin(ps * 7.0 + fi) * 3.0, 16.0 + ps * 50.0));
    col += vec3(1.0, 0.7, 0.25) * step(length(px - spk), 0.9) * (1.0 - ps) * u_fire;
  }

  // the camper
  float litS = clamp(0.3 + 0.55 * (1.0 - u_night) + 1.3 * fireGlow, 0.0, 1.3);
  vec2 cq = px - vec2(floor(u_cx), 11.0);
  if (u_cdir < 0.0) cq.x = 5.0 - cq.x;
  vec4 cs = mix(camperWalk(cq, step(0.0, sin(u_cswing))), camperSit(cq), u_cmode);
  col = mix(col, cs.rgb * litS, cs.a);
  // steam off the mug
  float ms = mod(t * 3.0, 6.0);
  col = mix(col, vec3(0.8, 0.85, 0.95), rect(px, vec2(floor(u_cx) + 7.0 + floor(sin(t * 2.0) * 1.2), 20.0 + ms), vec2(1.0, 1.0)) * u_cmode * (1.0 - ms / 6.0) * step(bayer4(px), 0.7));

  // the fox
  vec2 fq = px - vec2(floor(u_fx), 11.0);
  if (u_fdir > 0.0) fq.x = 14.0 - fq.x;
  vec4 fs = mix(foxWalk(fq, step(0.0, sin(u_fswing))), foxSit(fq, floor(sin(t * 1.3) + 0.5)), u_fmode);
  vec3 fxc = fs.rgb * litS;
  fxc = mix(fxc, vec3(1.0, 0.9, 0.4), rect(fq, vec2(2.0, 7.0), vec2(1.0, 1.0)) * u_fmode * step(0.25, fireGlow) * u_night);
  col = mix(col, fxc, fs.a);

  // the owl on its branch
  vec2 oq = px - vec2(141.0, 51.0);
  float hx = floor(sin(t * 0.25) * 0.9 + 0.5);
  float ow = rect(oq, vec2(0.0, 0.0), vec2(5.0, 6.0)) + rect(oq, vec2(0.0, 5.0), vec2(5.0, 4.0)) + rect(oq, vec2(0.0, 9.0), vec2(1.0, 1.0)) + rect(oq, vec2(4.0, 9.0), vec2(1.0, 1.0));
  vec3 owC = vec3(0.34, 0.25, 0.17) * (0.55 + 0.45 * (1.0 - u_night)) + vec3(0.06, 0.07, 0.1) * u_night;
  col = mix(col, vec3(0.03, 0.04, 0.05), rect(px, vec2(136.0, 50.0), vec2(14.0, 1.0)));
  col = mix(col, owC, clamp(ow, 0.0, 1.0));
  col = mix(col, owC * 1.6, rect(oq, vec2(1.0, 0.0), vec2(3.0, 3.0)) * 0.7);
  float eopen = step(0.12, fract(t / 5.0)) * step(0.15, u_night);
  float big = step(0.5, u_owl);
  col = mix(col, vec3(1.0, 0.85, 0.2), (rect(oq, vec2(1.0 + hx, 6.0), vec2(1.0, 1.0 + big)) + rect(oq, vec2(3.0 + hx, 6.0), vec2(1.0, 1.0 + big))) * eopen);

  // fireflies
  for (int i = 0; i < 8; i++){
    float fi = float(i);
    float h = hash(vec2(fi, 21.0));
    vec2 fpos = floor(vec2(18.0 + h * 130.0 + sin(t * 0.4 + h * 20.0) * 7.0, 8.0 + hash(vec2(fi, 22.0)) * 38.0 + cos(t * 0.5 + h * 30.0) * 4.0));
    float bl = step(0.35, 0.5 + 0.5 * sin(t * 1.5 + h * 30.0));
    col += vec3(0.8, 1.0, 0.35) * step(length(px - fpos), 0.9) * bl * smoothstep(0.35, 0.8, u_night) * (1.0 - step(46.0, fpos.y) * 0.0);
  }

  vec2 p = (px + 0.5) / vec2(160.0, 90.0) - 0.5;
  col *= 1.0 - 0.45 * dot(p, p);
  col *= u_fade;

  const float LV = 14.0;
  col += (bayer4(px) - 0.47) / LV;
  col = floor(clamp(col, 0.0, 1.0) * LV) / LV;
  gl_FragColor = vec4(col, 1.0);
}
</script>

<script>
(function(){
'use strict';

const CYCLE = 200;
const clamp = (x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const sstep = (a,b,x)=>{const t=clamp((x-a)/(b-a));return t*t*(3-2*t);};
const $ = id => document.getElementById(id);

// dusk -> deep night -> aurora -> dawn
const KEYS = [
  {t:0,   skyTop:[.12,.10,.28],skyBot:[.55,.30,.35],glow:[.90,.40,.18],night:.25,aurora:0, fire:1},
  {t:30,  skyTop:[.07,.06,.20],skyBot:[.30,.18,.36],glow:[.45,.15,.12],night:.6, aurora:0, fire:1},
  {t:65,  skyTop:[.02,.03,.10],skyBot:[.06,.08,.20],glow:[.02,.03,.08],night:1,  aurora:0, fire:1},
  {t:105, skyTop:[.02,.03,.10],skyBot:[.06,.08,.20],glow:[.02,.03,.08],night:1,  aurora:1, fire:1},
  {t:150, skyTop:[.02,.03,.10],skyBot:[.07,.09,.22],glow:[.02,.03,.08],night:1,  aurora:.7,fire:1},
  {t:172, skyTop:[.05,.07,.18],skyBot:[.20,.22,.38],glow:[.35,.20,.28],night:.7, aurora:.2,fire:.8},
  {t:192, skyTop:[.25,.35,.65],skyBot:[.95,.70,.60],glow:[.80,.50,.30],night:.1, aurora:0, fire:.5},
  {t:200, skyTop:[.25,.35,.65],skyBot:[.95,.70,.60],glow:[.80,.50,.30],night:.1, aurora:0, fire:.5}
];
function sample(t){
  let i = 0; while(i<KEYS.length-2 && t>=KEYS[i+1].t) i++;
  const a = KEYS[i], b = KEYS[i+1], u = sstep(a.t,b.t,t), o = {};
  for(const k in a){
    if(k==='t') continue;
    o[k] = Array.isArray(a[k]) ? a[k].map((v,j)=>v+(b[k][j]-v)*u) : a[k]+(b[k]-a[k])*u;
  }
  return o;
}

// ---------- audio: warm pads, soft guitar arpeggios, crickets, an owl, a little wind ----------
const Aud = (function(){
  let ctx, master, pre, echoIn, padFlt, padGain, crO, crG, owO, owG;
  const pads = [];
  let nextBar = 0, barIdx = 0, muted = false, on = false, vol = 1, night = 0;
  let onHoot = null;
  const LEVEL = 0.6;
  const mtof = n => 440*Math.pow(2,(n-69)/12);
  const CH = [[40,47,52,55,59],[48,52,55,60,64],[43,50,55,59,62],[50,54,57,62,64]];   // Em  C  G  Dadd9
  const PENT = [64,67,69,71,74,76];

  function osc(type,f){ const o = ctx.createOscillator(); o.type = type; o.frequency.value = f; o.start(); return o; }
  function noiseBuf(){
    const len = ctx.sampleRate*4, b = ctx.createBuffer(1,len,ctx.sampleRate), d = b.getChannelData(0); let l = 0;
    for(let i=0;i<len;i++){ const w = Math.random()*2-1; l = (l+0.02*w)/1.02; d[i] = l*3.5; }
    return b;
  }
  function start(){
    ctx = new (window.AudioContext||window.webkitAudioContext)({latencyHint:'playback'});
    if(ctx.state==='suspended') ctx.resume();
    pre = ctx.createGain();
    master = ctx.createGain(); master.gain.value = 0;
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -20; comp.ratio.value = 6; comp.knee.value = 20; comp.attack.value = 0.01; comp.release.value = 0.3;
    pre.connect(master); master.connect(comp); comp.connect(ctx.destination);

    echoIn = ctx.createGain();
    const dl = ctx.createDelay(1.5); dl.delayTime.value = 0.6;
    const fb = ctx.createGain(); fb.gain.value = 0.4;
    const ef = ctx.createBiquadFilter(); ef.type = 'lowpass'; ef.frequency.value = 2400;
    echoIn.connect(dl); dl.connect(ef); ef.connect(fb); fb.connect(dl); ef.connect(pre);

    padFlt = ctx.createBiquadFilter(); padFlt.type = 'lowpass'; padFlt.frequency.value = 900; padFlt.Q.value = 0.3;
    padGain = ctx.createGain(); padGain.gain.value = 0.03;
    padFlt.connect(padGain); padGain.connect(pre);
    const ps = ctx.createGain(); ps.gain.value = 0.2; padGain.connect(ps); ps.connect(echoIn);
    for(let i=0;i<5;i++){ const o = osc(i%2?'triangle':'sine',110); o.detune.value = (i%2?5:-5); o.connect(padFlt); pads.push(o); }

    // soft wind
    const wb = ctx.createBufferSource(); wb.buffer = noiseBuf(); wb.loop = true; wb.start(0,Math.random()*2);
    const wf = ctx.createBiquadFilter(); wf.type = 'bandpass'; wf.frequency.value = 380; wf.Q.value = 0.6;
    const wg = ctx.createGain(); wg.gain.value = 0.03;
    wb.connect(wf); wf.connect(wg); wg.connect(pre);
    const wl = osc('sine',0.037), wlg = ctx.createGain(); wlg.gain.value = 0.02; wl.connect(wlg); wlg.connect(wg.gain);

    // crickets: one persistent oscillator, gated by scheduled envelopes
    crO = osc('sine',4400); crG = ctx.createGain(); crG.gain.value = 0.0001;
    const cf = ctx.createBiquadFilter(); cf.type = 'bandpass'; cf.frequency.value = 4400; cf.Q.value = 3;
    crO.connect(cf); cf.connect(crG); crG.connect(pre);

    // owl: one persistent oscillator through a low-pass, gated the same way
    owO = osc('sine',400); owG = ctx.createGain(); owG.gain.value = 0.0001;
    const of = ctx.createBiquadFilter(); of.type = 'lowpass'; of.frequency.value = 800;
    owO.connect(of); of.connect(owG); owG.connect(pre);
    const os = ctx.createGain(); os.gain.value = 0.5; owG.connect(os); os.connect(echoIn);

    master.gain.setTargetAtTime(LEVEL*vol,ctx.currentTime,1.0);
    nextBar = ctx.currentTime+0.2; on = true;
    setInterval(tick,200);
  }
  function pluck(f,t,v,len,echo){
    const o = ctx.createOscillator(), g = ctx.createGain(), lp = ctx.createBiquadFilter();
    o.type = 'triangle'; o.frequency.value = f;
    lp.type = 'lowpass'; lp.frequency.setValueAtTime(3200,t); lp.frequency.exponentialRampToValueAtTime(700,t+0.5);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.linearRampToValueAtTime(v,t+0.006);
    g.gain.exponentialRampToValueAtTime(0.0001,t+len);
    o.connect(lp); lp.connect(g); g.connect(pre);
    if(echo){ const e = ctx.createGain(); e.gain.value = echo; g.connect(e); e.connect(echoIn); }
    o.start(t); o.stop(t+len+0.05);
  }
  function chirps(t0){
    for(let g=0;g<8;g++){
      const tg = t0 + g + Math.random()*0.6;
      for(let p=0;p<3;p++){
        const tp = tg + p*0.07;
        crG.gain.setValueAtTime(0.0001,tp);
        crG.gain.linearRampToValueAtTime(0.004*night,tp+0.006);
        crG.gain.linearRampToValueAtTime(0.0001,tp+0.04);
      }
    }
  }
  function hootAt(t,f,dur){
    owO.frequency.setValueAtTime(f,t); owO.frequency.linearRampToValueAtTime(f*0.9,t+dur);
    owG.gain.setValueAtTime(0.0001,t);
    owG.gain.linearRampToValueAtTime(0.05,t+0.07);
    owG.gain.setValueAtTime(0.05,t+dur*0.75);
    owG.gain.linearRampToValueAtTime(0.0001,t+dur+0.12);
  }
  function hoot(t0){
    const t = t0 + 0.5 + Math.random()*4;
    hootAt(t,400,0.35); hootAt(t+0.6,380,0.2); hootAt(t+1.0,380,0.2); hootAt(t+1.5,350,0.9);
    if(onHoot) setTimeout(onHoot, Math.max(0,(t-ctx.currentTime)*1000));
  }
  function scheduleBar(t0){
    const ch = CH[barIdx%4];
    pads.forEach((o,k)=>o.frequency.setTargetAtTime(mtof(ch[k]),t0,1.0));
    padFlt.frequency.setTargetAtTime(750+250*(1-night),t0,2.0);
    [0,2,3,4,3,2,1,2].forEach((idx,i)=>{
      if(Math.random()<0.78) pluck(mtof(ch[idx]+12+(idx===0?12:0)),t0+i*1.0+(i%2?0.05:0),0.035,1.6,0.5);
    });
    pluck(mtof(PENT[Math.floor(Math.random()*PENT.length)]+12),t0+1+Math.random()*6,0.022,2.2,0.55);
    if(night>0.3) chirps(t0);
    if(night>0.5 && Math.random()<0.13) hoot(t0);
    barIdx++;
  }
  function tick(){ while(on && nextBar < ctx.currentTime+1.5){ scheduleBar(nextBar); nextBar += 8; } }
  function shimmer(){
    if(!on) return;
    const t = ctx.currentTime+0.05;
    [88,91,95,100].forEach((n,i)=>pluck(mtof(n),t+i*0.16,0.025,2.2,0.6));
  }
  function setVol(v){ vol = v; if(on) master.gain.setTargetAtTime(muted?0:LEVEL*v,ctx.currentTime,0.4); }
  function toggleMute(){ muted = !muted; if(on) master.gain.setTargetAtTime(muted?0:LEVEL*vol,ctx.currentTime,0.1); return muted; }
  return { start, shimmer, setVol, toggleMute, setNight:v=>{night=v;}, set onHoot(f){onHoot=f;} };
})();

// ---------- WebGL ----------
const canvas = $('gl');
const gl = canvas.getContext('webgl',{antialias:false,alpha:false});
function fail(m){ const e=$('err'); e.style.display='block'; e.textContent=m; }
if(!gl){ fail('WebGL is not available in this browser.'); return; }
function mk(type,src){
  const s = gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) fail('Shader error:\n'+gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog,mk(gl.VERTEX_SHADER,$('vs').textContent));
gl.attachShader(prog,mk(gl.FRAGMENT_SHADER,$('fs').textContent));
gl.linkProgram(prog);
if(!gl.getProgramParameter(prog,gl.LINK_STATUS)) fail('Link error:\n'+gl.getProgramInfoLog(prog));
gl.useProgram(prog);
const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER,buf);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1, 3,-1, -1,3]),gl.STATIC_DRAW);
const aPos = gl.getAttribLocation(prog,'a_pos');
gl.enableVertexAttribArray(aPos);
gl.vertexAttribPointer(aPos,2,gl.FLOAT,false,0,0);
gl.viewport(0,0,160,90);
const L = {};
['u_time','u_night','u_aurora','u_shoot','u_owl','u_fade','u_cx','u_cmode','u_cdir','u_cswing','u_fx','u_fmode','u_fdir','u_fswing','u_fire',
 'u_skyTop','u_skyBot','u_glow'].forEach(n=>L[n]=gl.getUniformLocation(prog,n));

// ---------- story ----------
let clk = 0, running = false, speed = 1, sleepLen = 0, sleepEnd = 0, owlT = -99;
const SHOOT = [72,100,128,158];
let shotDone = {};
Aud.onHoot = ()=>{ owlT = performance.now(); };
const ease = u => { u = clamp(u); return u*u*(3-2*u); };

function story(){
  const s = {cx:40,cmode:0,cdir:1,csw:0,fx:300,fmode:0,fdir:-1,fsw:0};
  if(clk<6){ s.cx = 40; }
  else if(clk<28){ s.cx = 40+46*ease((clk-6)/22); s.csw = s.cx*0.9; }
  else if(clk<170){ s.cx = 86; s.cmode = 1; }
  else if(clk<172){ s.cx = 86; }
  else if(clk<194){ s.cx = 86-46*ease((clk-172)/22); s.cdir = -1; s.csw = s.cx*0.9; }
  else { s.cx = 40; }
  if(clk>=56 && clk<76){ s.fx = 172-60*ease((clk-56)/20); s.fsw = s.fx*1.1; }
  else if(clk>=76 && clk<142){ s.fx = 112; s.fmode = 1; }
  else if(clk>=142 && clk<162){ s.fx = 112+60*ease((clk-142)/20); s.fdir = 1; s.fsw = s.fx*1.1; }
  return s;
}

let last = performance.now(), lastDraw = 0, lastAud = 0;
function frame(now){
  const dt = Math.min(0.1,(now-last)/1000); last = now;
  if(running) clk = (clk + dt*speed) % CYCLE;
  if(now-lastDraw >= 33){
    lastDraw = now;
    const k = sample(clk), s = story();
    let shoot = -1;
    for(const ts of SHOOT){
      const u = (clk-ts)/1.8;
      if(u>=0 && u<1){ shoot = u; if(running && !shotDone[ts]){ shotDone[ts] = true; Aud.shimmer(); } }
    }
    if(clk<60) shotDone = {};
    let sl = 1;
    if(sleepEnd){ sl = clamp((sleepEnd-Date.now())/(sleepLen*0.3),0,1); }

    gl.uniform1f(L.u_time,now/1000);
    gl.uniform1f(L.u_night,k.night);
    gl.uniform1f(L.u_aurora,k.aurora);
    gl.uniform1f(L.u_shoot,shoot);
    gl.uniform1f(L.u_owl,(now-owlT)<1800 ? 1 : 0);
    gl.uniform1f(L.u_fire,k.fire);
    gl.uniform1f(L.u_fade,running ? Math.min(sstep(0,1.5,clk),1-sstep(198.5,200,clk))*sl : 0.9);
    gl.uniform1f(L.u_cx,s.cx); gl.uniform1f(L.u_cmode,s.cmode); gl.uniform1f(L.u_cdir,s.cdir); gl.uniform1f(L.u_cswing,s.csw);
    gl.uniform1f(L.u_fx,s.fx); gl.uniform1f(L.u_fmode,s.fmode); gl.uniform1f(L.u_fdir,s.fdir); gl.uniform1f(L.u_fswing,s.fsw);
    gl.uniform3fv(L.u_skyTop,k.skyTop); gl.uniform3fv(L.u_skyBot,k.skyBot); gl.uniform3fv(L.u_glow,k.glow);
    gl.drawArrays(gl.TRIANGLES,0,3);
    if(now-lastAud>400){ lastAud = now; Aud.setNight(k.night); Aud.setVol(sl); }
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---------- UI ----------
$('btn-start').addEventListener('click',()=>{
  try{ Aud.start(); }catch(e){ console.warn('audio unavailable',e); }
  $('start').classList.add('hide');
  running = true; clk = 0;
});
const dev = $('dev');
const toggleDev = ()=>dev.classList.toggle('on');
$('devdot').addEventListener('click',toggleDev);
const JUMPS = [0,30,65,105,150,172];
function jump(){ const n = JUMPS.find(t=>t>clk+1); clk = n===undefined ? 0 : n; }
$('dev-jump').addEventListener('click',jump);
$('dev-speed').addEventListener('click',()=>{ speed = speed===1 ? 10 : 1; $('dev-speed').textContent = 'SPEED x'+speed; });
$('dev-mute').addEventListener('click',()=>{ $('dev-mute').textContent = Aud.toggleMute() ? 'UNMUTE [M]' : 'MUTE [M]'; });
$('dev-sleep').addEventListener('click',()=>{
  const opts = [0,15,30,60], i = (opts.indexOf(sleepLen/60000)+1)%opts.length, m = opts[i];
  sleepLen = m*60000; sleepEnd = m ? Date.now()+sleepLen : 0;
  $('dev-sleep').textContent = m ? 'SLEEP: '+m+' MIN' : 'SLEEP: OFF';
});
addEventListener('keydown',e=>{
  const k = e.key.toLowerCase();
  if(k==='s') toggleDev(); else if(k==='n') jump(); else if(k==='m') $('dev-mute').click();
});
setInterval(()=>{ if(dev.classList.contains('on')) $('devinfo').textContent = 'TIME '+clk.toFixed(0)+'/'+CYCLE+'s'; },250);
window.__seek = t=>{ running = true; $('start').classList.add('hide'); clk = t; };
window.__owl = ()=>{ owlT = performance.now(); };

})();
</script>
