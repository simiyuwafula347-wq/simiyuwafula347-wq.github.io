<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Muscovy Duck Kit | Larry’s Cove</title>
<meta name="description" content="A cosy pixel music player UI: a Muscovy duck that preens and shakes its tail, and a progress bar made of feathers that line up as the song plays.">
<meta name="theme-color" content="#23212a">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=VT323&display=swap" rel="stylesheet">
<style>
:root{--k:#23212a;--d:#3b3744;--a:#8b8a93;--w:#ece8df;--l:#8a7384;--glow:#d3b4e0;--head:"Silkscreen","Courier New",monospace;--body:"VT323","Courier New",monospace}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--k);color:var(--w);font:22px/1.2 var(--body);display:grid;place-items:center;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);background-image:linear-gradient(45deg,#2a2832 25%,transparent 25%,transparent 75%,#2a2832 75%),linear-gradient(45deg,#2a2832 25%,transparent 25%,transparent 75%,#2a2832 75%);background-size:8px 8px;background-position:0 0,4px 4px}
.card{width:min(92vw,420px);background:var(--d);border:4px solid var(--a);box-shadow:8px 8px 0 #121116;padding:12px}
.scene{position:relative;border:4px solid var(--k);background:var(--k)}
canvas{display:block;width:100%;image-rendering:pixelated}
#scene{aspect-ratio:120/84;cursor:pointer}
.say{position:absolute;font:12px var(--head);color:var(--w);text-shadow:2px 2px 0 var(--k);pointer-events:none;transform:translateX(-50%);animation:up 1.1s steps(8) forwards;white-space:nowrap}
@keyframes up{to{opacity:0;margin-top:-50px}}
.kick{font:10px var(--head);letter-spacing:.2em;color:var(--a);text-transform:uppercase;margin-top:12px}
h1{font:700 17px/1.2 var(--head);text-transform:uppercase;margin-top:4px}
.art{color:var(--a)}
#bar{height:54px;margin-top:6px;touch-action:none;cursor:pointer;background:var(--k);border:3px solid var(--k)}
.times{display:flex;justify-content:space-between;color:var(--a)}
.ctl{display:flex;justify-content:center;gap:12px;margin-top:10px}
.b{width:74px;height:52px;border:0;cursor:pointer;display:grid;place-items:center;color:var(--k);background:var(--w);box-shadow:inset -4px -4px 0 var(--a),0 5px 0 var(--k)}
.b.big{width:96px}.b:active{transform:translateY(3px);box-shadow:inset -4px -4px 0 var(--a),0 2px 0 var(--k)}
.b svg{width:24px;height:24px;fill:currentColor}
.ov{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:rgba(20,18,24,.9);text-align:center;padding:20px}
.ov[hidden]{display:none}
.go{font:13px var(--head);padding:13px 22px;margin-top:14px;background:var(--w);color:var(--k);border:0;cursor:pointer;text-transform:uppercase;box-shadow:inset -3px -3px 0 var(--a)}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<main class="card">
  <div class="scene" id="sc"><canvas id="scene" width="120" height="84" aria-label="Pixel Muscovy duck grooming itself by the pond"></canvas></div>
  <p class="kick">Muscovy Duck Kit</p>
  <h1 id="tt">Pond Morning</h1>
  <p class="art" id="ar">Larry’s Cove</p>
  <canvas id="bar" height="54"></canvas>
  <div class="times"><span id="cur">0:00</span><span id="tot">0:00</span></div>
  <div class="ctl">
    <button class="b" id="prev" aria-label="Previous"><svg viewBox="0 0 8 8" shape-rendering="crispEdges" style="transform:scaleX(-1)"><path d="M0 0h2v8H0zM2 1h2v6H2zM4 2h2v4H4zM6 3h2v2H6z"/></svg></button>
    <button class="b big" id="play" aria-label="Play"><svg viewBox="0 0 8 8" shape-rendering="crispEdges" id="pi"><path d="M1 0h2v8H1zM3 1h2v6H3zM5 2h2v4H5z"/></svg></button>
    <button class="b" id="next" aria-label="Next"><svg viewBox="0 0 8 8" shape-rendering="crispEdges"><path d="M0 0h2v8H0zM2 1h2v6H2zM4 2h2v4H4zM6 3h2v2H6z"/></svg></button>
  </div>
</main>
<div class="ov" id="start"><div><p class="kick">Muscovy Duck Kit</p><h1 style="font-size:22px;margin:10px 0">A quiet morning at the pond</h1><p class="art">Tap the duck. It has opinions about its tail.</p><button class="go" id="go">Tap to start</button></div></div>

<script>
const $=s=>document.querySelector(s);
/* TRACKS: demo tracks are generated by the page. To use a real song add  src:"music/yoursong.mp3"  to a track (t = title, a = artist, d = seconds). */
const TR=[{t:"Pond Morning",a:"Larry’s Cove",d:52,c:[146.8,174.6,220,261.6],s:[293.7,349.2,440,523.3]},
          {t:"Feather Weather",a:"Larry’s Cove",d:44,c:[110,130.8,164.8,196],s:[220,261.6,329.6,392]},
          {t:"Slow Waddle",a:"Larry’s Cove",d:58,c:[98,123.5,146.8,185],s:[196,246.9,293.7,370]}];
let ti=0,pos=0,playing=false,ctx=null,pad,padG;
const fmt=s=>Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0");

/* ---------- sound ---------- */
function audio(){
  if(ctx)return;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;ctx=new AC();
  const len=ctx.sampleRate*2,b=ctx.createBuffer(1,len,ctx.sampleRate),d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
  const n=ctx.createBufferSource();n.buffer=b;n.loop=true;const f=ctx.createBiquadFilter();f.type="lowpass";f.frequency.value=380;
  const ng=ctx.createGain();ng.gain.value=.05;n.connect(f);f.connect(ng);ng.connect(ctx.destination);n.start();        // soft pond air
  padG=ctx.createGain();padG.gain.value=0;const lp=ctx.createBiquadFilter();lp.type="lowpass";lp.frequency.value=650;padG.connect(lp);lp.connect(ctx.destination);
  pad=[0,1,2,3].map(i=>{const o=ctx.createOscillator();o.type=i%2?"triangle":"sine";o.connect(padG);o.start();return o});
  setInterval(pluck,1700);tune();
}
function tune(){if(ctx)pad.forEach((o,i)=>o.frequency.setTargetAtTime(TR[ti].c[i],ctx.currentTime,.5))}
function mix(){if(ctx)padG.gain.setTargetAtTime(playing&&!TR[ti].src?.06:0,ctx.currentTime,.3)}
function pluck(){if(!ctx||!playing||TR[ti].src)return;const o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime;
  o.type="sine";o.frequency.value=TR[ti].s[Math.floor(Math.random()*4)];g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.07,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+1.3);
  o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+1.4)}

/* ---------- player ---------- */
const au=new Audio();au.preload="metadata";
au.addEventListener("loadedmetadata",()=>{if(TR[ti].src&&isFinite(au.duration)){TR[ti].d=au.duration;$("#tot").textContent=fmt(au.duration)}});
au.addEventListener("ended",()=>load(ti+1));
function load(i){ti=(i+TR.length)%TR.length;pos=0;$("#tt").textContent=TR[ti].t;$("#ar").textContent=TR[ti].a;$("#tot").textContent=fmt(TR[ti].d);tune();
  if(TR[ti].src){au.src=TR[ti].src;au.currentTime=0;if(playing)au.play().catch(()=>{})}else au.pause();mix()}
function setPlay(p){playing=p;if(TR[ti].src){p?au.play().catch(()=>{}):au.pause()}$("#pi").innerHTML=p?'<path d="M1 0h2v8H1zM5 0h2v8H5z"/>':'<path d="M1 0h2v8H1zM3 1h2v6H3zM5 2h2v4H5z"/>';mix()}
$("#play").onclick=()=>{audio();if(ctx&&ctx.state==="suspended")ctx.resume();setPlay(!playing)};
$("#next").onclick=()=>load(ti+1);
$("#prev").onclick=()=>pos>3?(pos=0,TR[ti].src&&(au.currentTime=0)):load(ti-1);
setInterval(()=>{if(!playing)return;if(TR[ti].src){pos=au.currentTime;return}pos+=.1;if(pos>=TR[ti].d)load(ti+1)},100);

/* ---------- feather-align scrubber: crooked feathers straighten (and glow) as the song plays ---------- */
const bar=$("#bar"),bx=bar.getContext("2d"),NF=26;
let rs=11;const rr=()=>(rs=(rs*16807)%2147483647)/2147483647;
const F=Array.from({length:NF},()=>({ang:0,base:(rr()<.5?-1:1)*(.45+rr()*.9),dy:Math.round(rr()*8-2),tone:rr()<.35}));
function bars(){const w=bar.clientWidth;if(bar.width!==w)bar.width=w;const h=54,fr=Math.min(pos/TR[ti].d,1),dx=w/NF;bx.clearRect(0,0,w,h);
  F.forEach((f,i)=>{const done=(i+.5)/NF<=fr,tg=done?0:Math.round(f.base/.26)*.26;f.ang+=(tg-f.ang)*.22;
    bx.save();bx.translate(i*dx+dx/2,h-8-(done?0:f.dy));bx.rotate(f.ang);
    if(done){bx.shadowColor="#d3b4e0";bx.shadowBlur=10}
    bx.fillStyle=done?"#ece8df":(f.tone?"#8b8a93":"#b5b0a8");bx.fillRect(-2,-34,4,36);                      // quill
    bx.fillStyle=done?"#d3b4e0":"#8a7384";bx.fillRect(-6,-30,4,3);bx.fillRect(2,-24,4,3);bx.fillRect(-6,-18,4,3);bx.fillRect(2,-12,4,3);   // barbs
    bx.restore()});
  $("#cur").textContent=fmt(pos)}
let drag=false;const seek=e=>{const r=bar.getBoundingClientRect();pos=Math.min(Math.max((e.clientX-r.left)/r.width,0),1)*TR[ti].d;if(TR[ti].src)au.currentTime=pos};
bar.addEventListener("pointerdown",e=>{drag=true;seek(e)});addEventListener("pointermove",e=>{if(drag)seek(e)});addEventListener("pointerup",()=>drag=false);

/* ---------- WebGL: the whole pond is one fragment shader. Dithered sky, bank, pond, fireflies and the duck are computed per pixel on a 120x84 grid ---------- */
function GL(cv,fs){const g=cv.getContext("webgl",{antialias:false});if(!g)return null;
  const mk=(t,s)=>{const o=g.createShader(t);g.shaderSource(o,s);g.compileShader(o);if(!g.getShaderParameter(o,g.COMPILE_STATUS))console.error(g.getShaderInfoLog(o));return o};
  const p=g.createProgram();g.attachShader(p,mk(g.VERTEX_SHADER,"attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}"));g.attachShader(p,mk(g.FRAGMENT_SHADER,fs));g.linkProgram(p);
  if(!g.getProgramParameter(p,g.LINK_STATUS))return null;g.useProgram(p);
  g.bindBuffer(g.ARRAY_BUFFER,g.createBuffer());g.bufferData(g.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),g.STATIC_DRAW);
  const a=g.getAttribLocation(p,"a");g.enableVertexAttribArray(a);g.vertexAttribPointer(a,2,g.FLOAT,false,0,0);
  const L={};return{gl:g,u:n=>L[n]||(L[n]=g.getUniformLocation(p,n)),draw(){g.viewport(0,0,cv.width,cv.height);g.drawArrays(g.TRIANGLES,0,3)}}}
const FS=`#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
float h(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);}
float sq(float x){return x*x;}
float b2(vec2 p){p=mod(p,2.);return p.x<1.?(p.y<1.?0.:3.):(p.y<1.?2.:1.);}
float bay(vec2 p){return (b2(p)*4.+b2(floor(p/2.))+.5)/16.;}
bool box(vec2 p,vec2 o,vec2 s){vec2 d=p-o;return d.x>=0.&&d.y>=0.&&d.x<s.x&&d.y<s.y;}
uniform float uT,uSx,uSy,uMode;uniform vec3 uP[6];
const vec3 K=vec3(.137,.129,.165),D=vec3(.231,.216,.267),A=vec3(.545,.541,.576),Wh=vec3(.925,.91,.875),L=vec3(.541,.451,.518),GLOW=vec3(.827,.706,.878),BANK=vec3(.169,.157,.2);
const vec3 S0=vec3(.298,.286,.345),S1=vec3(.243,.231,.286),S2=vec3(.196,.184,.231),S3=vec3(.153,.145,.184);
void main(){
  vec2 p=vec2(floor(gl_FragCoord.x),83.-floor(gl_FragCoord.y));
  float bob=floor(sin(uT*2.)+.5);
  // dithered dusk, stars, crescent moon
  float lv=clamp(floor(p.y/84.*4.+(bay(p)-.5)*.9),0.,3.);
  vec3 c=lv<1.?S0:lv<2.?S1:lv<3.?S2:S3;
  if(p.y<34.&&h(p*1.7)<.012&&fract(uT*.4+h(p))>.3)c=A;
  if(length(p-vec2(100.,14.))<5.5&&length(p-vec2(102.5,12.5))>4.6)c=Wh;
  // bank with grass blades
  if(p.y>=66.){c=BANK;if(p.y<70.&&bay(p)<(70.-p.y)/4.)c=D;if(h(p)<.06)c=L;}
  else if(p.y>=62.){float bl=h(vec2(p.x,3.));if(bl<.22&&p.y>=66.-floor(1.+h(vec2(p.x,9.))*4.))c=bl<.08?L:D;}
  // pond: reflected dusk, rings, moon streak
  vec2 q=vec2((p.x-98.)/24.,(p.y-76.)/6.);float e=dot(q,q);
  if(e<=1.){float l2=clamp(floor((p.y-70.)/12.*3.+(bay(p)-.5)*.9),0.,2.);c=l2<1.?S1:l2<2.?S2:S3;
    if(fract(sqrt(e)*3.-uT*.35)>.88&&bay(p+1.)<.8)c=A;
    if(abs(p.x-98.5)<2.&&h(vec2(p.y,floor(uT*2.5)))>.45+(p.y-70.)*.03)c=Wh;
    if(e>.78&&bay(p)<(e-.78)/.22)c=D;
    if(h(p+floor(uT*2.))<.015)c=Wh;}
  // fireflies
  for(int i=0;i<4;i++){float fi=float(i);vec2 fp=floor(vec2(14.+fi*29.+sin(uT*.7+fi*2.)*6.,30.+fi*7.+cos(uT*.5+fi*3.)*5.));float ph=fract(uT*.6+fi*.27);
    if(ph>.35&&(all(equal(p,fp))||(ph>.7&&abs(p.x-fp.x)+abs(p.y-fp.y)<1.5)))c=GLOW;}
  // legs
  if(box(p,vec2(48.,64.),vec2(2.,3.))||box(p,vec2(66.,64.),vec2(2.,3.)))c=A;
  // body: dithered belly, chalk wing
  vec2 lb=p-vec2(37.,41.+bob);
  if(box(lb,vec2(0.),vec2(46.,24.))){float dx=lb.x-23.,dy=lb.y-12.;float e2=sq(dx/22.)+sq(dy/11.);
    if(e2<=1.){float wing=sq((dx+1.)/11.)+sq((dy+1.)/5.5);vec3 bc;
      if(e2>.86&&bay(lb)<(e2-.86)/.14)bc=D;
      else if(wing<1.){bc=Wh;if(wing>.7&&bay(lb)<(wing-.7)/.3*.9)bc=K;else if(wing<.7&&mod(lb.y,3.)<1.&&bay(lb+1.)>.6)bc=A;}
      else if(dy>4.)bc=bay(lb)<clamp(.3+(dy-4.)/9.,0.,1.)?L:K;
      else bc=h(lb)<.1?A:K;
      c=bc;}}
  // tail
  vec2 lt=p-vec2(31.+uSx,40.+bob+uSy);
  if(box(lt,vec2(0.),vec2(10.,8.))&&!(lt.x<lt.y*.4||lt.x>9.-lt.y*.15))c=(lt.y<2.&&lt.x>5.)?A:(h(lt+vec2(3.,0.))<.2?A:K);
  // head: up, or tucked while preening
  if(uMode<.5){vec2 lh=p-vec2(63.,32.+bob);
    if(box(lh,vec2(0.),vec2(14.,12.))){float dx=lh.x-5.,dy=lh.y-5.;
      if(dx*dx+dy*dy<=25.){c=K;if(dx>=1.&&dy>=0.)c=bay(lh)<.5?L:K;else if(lh==vec2(7.,3.))c=Wh;}
      else if(dx>=5.&&dx<=8.&&dy>=0.&&dy<=2.)c=A;}}
  else{vec2 lh=p-vec2(57.,36.+bob);
    if(box(lh,vec2(0.),vec2(12.,14.))){float dx=lh.x-5.,dy=lh.y-5.;
      if(dx*dx+dy*dy<=25.){c=K;if(lh==vec2(6.,4.))c=Wh;else if(dy>=1.&&dx<=0.)c=bay(lh)<.5?L:K;}
      else if(dx>=-1.&&dx<=1.&&dy>=5.&&dy<=8.)c=A;}}
  // feather bits from a tap
  for(int i=0;i<6;i++)if(uP[i].z>.5&&box(p,floor(uP[i].xy),vec2(1.,2.)))c=Wh;
  gl_FragColor=vec4(c,1.);
}`;
const cv=$("#scene"),G=GL(cv,FS);
let tail=0,parts=[],mode=0,modeT=0;
function scene(ms){if(!G)return;const t=ms/1000,g=G.gl,u=G.u;
  modeT-=1/20;if(modeT<=0){mode=mode?0:1;modeT=mode?1.8:2.4+Math.random()*2}                                 // idle <-> grooming
  const sx=tail>0?(Math.floor(tail*30)%2?-1:1)*2:0,sy=tail>0?-1:0;if(tail>0)tail-=1/20;
  parts=parts.filter(p=>(p.l-=.05)>0);parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.12});
  const pa=new Float32Array(18);parts.slice(0,6).forEach((p,i)=>{pa[i*3]=p.x;pa[i*3+1]=p.y;pa[i*3+2]=1});
  g.uniform1f(u("uT"),t);g.uniform1f(u("uSx"),sx);g.uniform1f(u("uSy"),sy);g.uniform1f(u("uMode"),mode);g.uniform3fv(u("uP"),pa);G.draw()}
let last=0;const loop=ms=>{if(ms-last>48){last=ms;scene(ms);bars()}requestAnimationFrame(loop)};
const LINES=["*tail shake*","coo.","(muscovies don’t quack)","*soft hiss*","preening. do not disturb."];let nl=0;
$("#sc").addEventListener("pointerdown",e=>{tail=.9;mode=0;modeT=2;for(let i=0;i<6;i++)parts.push({x:34,y:44,vx:-1.2-Math.random()*1.2,vy:-1-Math.random(),l:1});
  const r=$("#sc").getBoundingClientRect(),s=document.createElement("span");s.className="say";s.textContent=LINES[nl++%LINES.length];s.style.left=(e.clientX-r.left)+"px";s.style.top=(e.clientY-r.top)+"px";$("#sc").appendChild(s);setTimeout(()=>s.remove(),1100)});
$("#go").onclick=()=>{$("#start").hidden=true;audio();if(ctx&&ctx.state==="suspended")ctx.resume();mix()};
load(0);requestAnimationFrame(loop);
</script>
</body>
</html>
